<!--
  The component markup, and nothing else.

  No ids anywhere on purpose: the demo page puts three of these on one page, so
  anything that has to be unique per instance would have to be renamed on every
  copy. State lives in ARIA attributes the component already needs —
  `aria-current` on the destinations, `aria-expanded` on the panel button — and
  the CSS reads those directly.

  Every label stays in the DOM at every size. The morph decides whether a label
  is *visible*; it is the accessible name of its action either way, which is why
  none of these need an aria-label.
-->

<nav class="liquid-glass-toolbar" aria-label="Primary">
  <div class="liquid-glass-toolbar__shell">

    <div class="liquid-glass-toolbar__bar">

      <a class="liquid-glass-toolbar__action" href="#" aria-current="page">
        <span class="liquid-glass-toolbar__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4.4 19.5v-7.4a7.6 7.6 0 0 1 15.2 0v7.4" />
            <path d="M2.6 19.5h18.8" />
          </svg>
        </span>
        <span class="liquid-glass-toolbar__reveal">
          <span class="liquid-glass-toolbar__label">Home</span>
        </span>
      </a>

      <!-- The search item is a <label>, so a click anywhere on the icon focuses
           the input and `:focus-within` opens the field. No JavaScript decides
           this one. -->
      <label class="liquid-glass-toolbar__action liquid-glass-toolbar__action--search">
        <span class="liquid-glass-toolbar__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="10.4" cy="10.4" r="6.4" />
            <path d="M15.2 15.2 20 20" />
          </svg>
        </span>
        <span class="liquid-glass-toolbar__reveal">
          <input class="liquid-glass-toolbar__input" type="text"
                 placeholder="Search…" aria-label="Search" />
        </span>
      </label>

      <a class="liquid-glass-toolbar__action" href="#" aria-current="false">
        <span class="liquid-glass-toolbar__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3.4" y="4.4" width="17.2" height="6.2" rx="1.7" />
            <rect x="3.4" y="13.4" width="17.2" height="6.2" rx="1.7" />
            <path d="M9.9 7.5h4.2M9.9 16.5h4.2" />
          </svg>
        </span>
        <span class="liquid-glass-toolbar__reveal">
          <span class="liquid-glass-toolbar__label">Archive</span>
        </span>
      </a>

      <button class="liquid-glass-toolbar__action liquid-glass-toolbar__action--panel"
              type="button" aria-expanded="false">
        <span class="liquid-glass-toolbar__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4.2 14.5v4M9.4 9.7v8.8M14.6 5.5v13M19.8 11.9v6.6" />
          </svg>
          <span class="liquid-glass-toolbar__badge" aria-hidden="true"></span>
        </span>
        <span class="liquid-glass-toolbar__reveal">
          <span class="liquid-glass-toolbar__label">Activity</span>
        </span>
      </button>

      <a class="liquid-glass-toolbar__action liquid-glass-toolbar__action--trailing" href="#" aria-current="false">
        <span class="liquid-glass-toolbar__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3.6 8.2h5.6M14.8 8.2h5.6" />
            <circle cx="12" cy="8.2" r="2.5" />
            <path d="M3.6 15.8h2.6M11.8 15.8h8.6" />
            <circle cx="9" cy="15.8" r="2.5" />
          </svg>
        </span>
        <span class="liquid-glass-toolbar__reveal">
          <span class="liquid-glass-toolbar__label">Settings</span>
        </span>
      </a>

    </div>

    <!-- The panel is inside the same glass surface as the bar. Opening it does
         not slide a second sheet out from underneath — the one surface changes
         shape. -->
    <div class="liquid-glass-toolbar__panel">
      <ul class="liquid-glass-toolbar__feed">

        <li>
          <a class="liquid-glass-toolbar__row liquid-glass-toolbar__row--unread" href="#">
            <span class="liquid-glass-toolbar__avatar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="9" r="3.6" />
                <path d="M5 20a7 7 0 0 1 14 0" />
              </svg>
            </span>
            <span class="liquid-glass-toolbar__line">
              <strong class="liquid-glass-toolbar__who">Mara</strong>
              commented on Toolbar morph
            </span>
            <span class="liquid-glass-toolbar__time">2m</span>
          </a>
        </li>

        <li>
          <a class="liquid-glass-toolbar__row liquid-glass-toolbar__row--unread" href="#">
            <span class="liquid-glass-toolbar__avatar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 3.4c.6 4.2 4.4 8 8.6 8.6-4.2.6-8 4.4-8.6 8.6-.6-4.2-4.4-8-8.6-8.6 4.2-.6 8-4.4 8.6-8.6z" />
              </svg>
            </span>
            <span class="liquid-glass-toolbar__line">
              <strong class="liquid-glass-toolbar__who">Preview</strong>
              build finished in 42s
            </span>
            <span class="liquid-glass-toolbar__time">14m</span>
          </a>
        </li>

        <li>
          <a class="liquid-glass-toolbar__row" href="#">
            <span class="liquid-glass-toolbar__avatar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="9" r="3.6" />
                <path d="M5 20a7 7 0 0 1 14 0" />
              </svg>
            </span>
            <span class="liquid-glass-toolbar__line">
              <strong class="liquid-glass-toolbar__who">Idris</strong>
              requested a review
            </span>
            <span class="liquid-glass-toolbar__time">1h</span>
          </a>
        </li>

        <li>
          <a class="liquid-glass-toolbar__row" href="#">
            <span class="liquid-glass-toolbar__avatar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M11.2 3.6H20v8.8l-8 8a1.9 1.9 0 0 1-2.7 0l-6.1-6.1a1.9 1.9 0 0 1 0-2.7z" />
                <circle cx="16.1" cy="7.6" r="1.4" />
              </svg>
            </span>
            <span class="liquid-glass-toolbar__line">
              <strong class="liquid-glass-toolbar__who">Invoice</strong>
              #2214 was paid
            </span>
            <span class="liquid-glass-toolbar__time">3h</span>
          </a>
        </li>

      </ul>
    </div>

  </div>
</nav>

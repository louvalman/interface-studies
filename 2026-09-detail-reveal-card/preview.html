<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2026-09-detail-reveal-card — preview</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap">

  <link rel="stylesheet" href="component.css">


  <!-- The ground, before the first paint. The index loads this frame with
     ?theme= on the src, so a thumbnail is never drawn on the wrong one and
     then corrected. Opened on its own, with no query, it keeps the light
     ground. -->
  <script>
    var theme = new URLSearchParams(location.search).get('theme');
    if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  </script>

  <style>
    /* Thumbnail scaffolding only — one instance, centred, no captions.
       Nothing here names a component class. */
    /* <html> carries a background purely so <body>'s stops propagating to the
       viewport canvas. The surround is deliberately not transitioned: inside
       the framed document a background-color transition stalls part-way and
       leaves it a muddy grey between the two tones. The card's own motion is
       what this page is showing; the backdrop can just cut. */
    /* The shared ground, and the only colour this page writes. Both values are
       literals repeated in every folder rather than shared from anywhere — the
       folder has to survive being copied out — but they have to be the same
       two numbers in all of them, or the rail stops reading as one set of
       cards. That is what this ground is for: it is the rail's, not the
       component's, which is why it follows the index into dark rather than
       staying lit under it. The index says which over ?theme= on the src and
       the preview:theme message; the script at the foot of the file listens. */
    :root { --preview-ground: #f3f2ef; }
    :root[data-theme="dark"] { --preview-ground: #191b1e; }

    html { background-color: var(--preview-ground); }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      /* An implicit auto column takes its max-content width and overflows
         quite happily, which left the card's own max-width: 100% resolving
         against 336px rather than against the frame: at 320 this page put a
         sideways scrollbar across itself. The track has to be allowed to
         shrink for the squeeze to reach the card. It changes nothing at the
         480px the rail lays this out at — the card is 336 and centred either
         way — and the pair is what _template/demo.html has carried all along. */
      grid-template-columns: minmax(0, 1fr);
      place-items: center;
      background-color: var(--preview-ground);
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
    }

    /* The dark card used to bring a #101216 surround with it, on the argument
       that the tone is the variant's rather than the page's. It is gone, and
       the ground above is the only one this file writes.

       It survived the sweep that took the inked plate's plotter grid off its
       thumbnail because it was never visible on the rail: the resting card
       was the light one, so the rule only ever fired inside quick look. The
       moment the resting card became the dark one — see the script — it would
       have fired on the card, and card 04 would have been the single card in
       a light rail carrying its own dark ground. That is the thing the shared
       ground exists to prevent, and it does not stop being that because the
       surface is the variant's own.

       Nothing is lost by it. A dark plate on paper is what the inversion is
       for: it is the widest separation this study's edge has ever had, where
       on its own ground the plate met a backdrop three ΔE away. */

    /* The index has told this thumbnail that the rail is moving under a
       finger. Every animation in the document stops for the length of the
       gesture and picks up where it left off.

       It is here rather than in the component because it is the rail's
       problem, not the study's: a same-origin iframe shares the index's main
       thread, so a card that keeps animating while it is being dragged is
       animating against the drag, on the same thread the drag needs. Measured
       across the whole rail: 80 dropped frames in a two-card drag against 20
       with this in.

       Global on purpose. It has to reach the component without naming a
       single one of its classes — the same rule the rest of this file keeps.
       Transitions are deliberately left out: stopping those mid-gesture makes
       states snap instead of settle, and they are not what costs. */
    :root[data-preview-paused] *,
    :root[data-preview-paused] *::before,
    :root[data-preview-paused] *::after {
      animation-play-state: paused !important;
    }
  </style>
</head>
<body>
  <a class="detail-reveal-card" href="#" tabindex="-1">
    <span class="detail-reveal-card__art" aria-hidden="true"></span>
    <span class="detail-reveal-card__header">
      <span class="detail-reveal-card__title">Field Notes</span>
      <span class="detail-reveal-card__pill">Issue 04</span>
    </span>
    <span class="detail-reveal-card__panel">
      <span class="detail-reveal-card__row">
        <span class="detail-reveal-card__label">
          <span class="detail-reveal-card__mark" aria-hidden="true">&#8594;</span>Read the essay
        </span>
        <svg class="detail-reveal-card__arrow" viewBox="0 0 16 16" fill="none"
             stroke="currentColor" stroke-width="1.3" aria-hidden="true">
          <path d="M4 12 12 4M6 4h6v6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </span>
      <span class="detail-reveal-card__reveal">
        <span class="detail-reveal-card__reveal-inner">
          <span class="detail-reveal-card__detail">
            <span class="detail-reveal-card__line">On details that survive a redesign</span>
            <span class="detail-reveal-card__line detail-reveal-card__line--muted">18 pages, illustrated</span>
          </span>
          <span class="detail-reveal-card__detail">
            <span class="detail-reveal-card__line">Published March 2026</span>
            <span class="detail-reveal-card__line detail-reveal-card__line--muted">Written in the studio</span>
          </span>
          <span class="detail-reveal-card__meta">Free &middot; 12 min read</span>
        </span>
      </span>
    </span>
  </a>

  <!--
    Thumbnail scaffolding only. Three jobs, all driven by the index and all
    inert when this file is opened on its own:

      1. A card's iframe has pointer events off, so the component's :hover can
         never fire there. The index says when a card is being looked at and
         this file decides what that means — here, the --open modifier.
      2. Quick look asks for the component's variants and steps through them.
         The list lives here, because the index must never name a component
         class. It reports labels; the index just draws dots.
      3. On the rail the card steps through the variants facing the rail on a
         timer of its own, so the thumbnail shows what the panel is for rather
         than standing on one card. See the rotation in the script.

    The base markup above matches component.html. The pin and the kicker are
    built here rather than sitting in the markup, because --map is the only
    variant that wants them, and __kicker sets `display: block` — an author
    rule the `hidden` attribute would lose to.
  -->
  <script>
    (function () {
      var CHANNEL = 'interface-studies';
      var root = document.querySelector('.detail-reveal-card');
      if (!root) return;

      var BASE = 'detail-reveal-card';

      var VARIANTS = [
        {
          id: 'light', label: 'Light', tone: 'light', classes: [], pin: false,
          title: 'Field Notes', pill: 'Issue 04', action: 'Read the essay',
          details: [
            ['On details that survive a redesign', '18 pages, illustrated'],
            ['Published March 2026', 'Written in the studio']
          ],
          meta: 'Free \u00b7 12 min read'
        },
        {
          id: 'dark', label: 'Dark', tone: 'dark', classes: ['--dark'], pin: false,
          title: 'Changelog', pill: 'v2.4', action: 'See what shipped',
          details: [
            ['Keyboard navigation everywhere', 'Eleven fixes, two new panels'],
            ['Released this week', 'No migration needed']
          ],
          meta: '18 commits \u00b7 4 contributors'
        },
        {
          id: 'map', label: 'Location', tone: 'light', classes: ['--map'], pin: true,
          title: 'Denmark', pill: 'GMT+2', action: 'Copenhagen',
          kicker: '55.6761\u00b0 N \u00b7 12.5683\u00b0 E',
          details: [
            ['14 Placeholder Street', '1050 Copenhagen K'],
            ['+45 00 00 00 00', 'hello@example.com']
          ],
          meta: '86 people \u00b7 Est. 2019'
        },
        {
          id: 'map-dark', label: 'Location, dark', tone: 'dark',
          classes: ['--map', '--dark'], pin: true,
          title: 'Denmark', pill: 'GMT+2', action: 'Copenhagen',
          kicker: '55.6761\u00b0 N \u00b7 12.5683\u00b0 E',
          details: [
            ['14 Placeholder Street', '1050 Copenhagen K'],
            ['+45 00 00 00 00', 'hello@example.com']
          ],
          meta: '86 people \u00b7 Est. 2019'
        },

        // A second place, so the rotation below has somewhere to go that is
        // still the map: the point of stepping the card is that --map is a
        // frame for a location rather than a picture of one, which one
        // location cannot show. It is the same modifier re-themed from
        // outside — bg, accent, art and the pin's position, handed in on the
        // component's own element — which is demo.html's 'Map, re-themed'
        // state, and nothing here is a rule written against a component
        // class.
        //
        // The accent is amber rather than another coral: on the rail these
        // two sit one step apart in a three-card cycle, and #ff7a5c against
        // #e8b13d is the separation that has to carry at thumbnail size. It
        // also clears 3:1 against both tones' surfaces — 3.63 on the light
        // one, 9.21 on the dark — where Denmark's own light coral is 2.73.
        // The arrow is the one thing the accent colours that carries meaning;
        // the pin is decoration and owes nothing.
        {
          id: 'map-2', label: 'Location, second', tone: 'light',
          classes: ['--map'], pin: true,
          title: 'Portugal', pill: 'GMT+1', action: 'Porto',
          kicker: '41.1579\u00b0 N \u00b7 8.6291\u00b0 W',
          details: [
            ['9 Placeholder Rua', '4050 Porto'],
            ['+351 000 000 000', 'porto@example.com']
          ],
          meta: '22 people \u00b7 Est. 2023',
          // The pin sits at 30% rather than mid-card, for the reason Denmark's
          // does: the panel's label row is at about 46%, and a pin there lands
          // on the type instead of on the map. It carries the contour rings
          // with it — the base art centres them on the same pair.
          //
          // The mesh is amber against blue and green, with no coral in it. A
          // warm-on-warm wash is what the first pass was, and beside Denmark
          // at thumbnail size it read as the same card with the colour turned
          // down: --map's light art opens at 0.28, so a light plate has very
          // little to spend and every stop has to be worth its place.
          vars: {
            '--detail-reveal-card-bg': '#f1efe8',
            '--detail-reveal-card-accent': '#a8710a',
            '--detail-reveal-card-pin-x': '36%',
            '--detail-reveal-card-pin-y': '30%',
            '--detail-reveal-card-art':
              'radial-gradient(42% 34% at 36% 30%, rgba(214, 138, 20, 0.52), transparent 70%),'
              + 'radial-gradient(48% 40% at 72% 24%, rgba(46, 130, 196, 0.44), transparent 72%),'
              + 'radial-gradient(48% 42% at 76% 76%, rgba(58, 166, 132, 0.38), transparent 72%),'
              + 'radial-gradient(56% 48% at 22% 76%, rgba(190, 150, 60, 0.36), transparent 74%),'
              + 'radial-gradient(80% 62% at 48% 44%, rgba(255, 255, 255, 0.50), transparent 74%),'
              + 'linear-gradient(180deg, rgba(255, 255, 255, 0.46), transparent 46%)'
          }
        },
        {
          id: 'map-2-dark', label: 'Location, second, dark', tone: 'dark',
          classes: ['--map', '--dark'], pin: true,
          title: 'Portugal', pill: 'GMT+1', action: 'Porto',
          kicker: '41.1579\u00b0 N \u00b7 8.6291\u00b0 W',
          details: [
            ['9 Placeholder Rua', '4050 Porto'],
            ['+351 000 000 000', 'porto@example.com']
          ],
          meta: '22 people \u00b7 Est. 2023',
          // No bg: --dark's #15171c is the surface, and it is what gives this
          // card its edge on a light rail. Only the accent, the art and the
          // pin are this place's.
          vars: {
            '--detail-reveal-card-accent': '#e8b13d',
            '--detail-reveal-card-pin-x': '36%',
            '--detail-reveal-card-pin-y': '30%',
            '--detail-reveal-card-art':
              'radial-gradient(40% 32% at 36% 30%, rgba(232, 177, 61, 0.50), transparent 70%),'
              + 'radial-gradient(50% 40% at 72% 22%, rgba(50, 120, 200, 0.46), transparent 72%),'
              + 'radial-gradient(48% 44% at 78% 76%, rgba(40, 175, 140, 0.42), transparent 72%),'
              + 'radial-gradient(58% 50% at 24% 80%, rgba(180, 130, 40, 0.38), transparent 74%),'
              + 'radial-gradient(100% 80% at 50% 30%, rgba(255, 255, 255, 0.06), transparent 70%)'
          }
        }
      ];

      var art = root.querySelector('.' + BASE + '__art');
      var title = root.querySelector('.' + BASE + '__title');
      var pill = root.querySelector('.' + BASE + '__pill');
      var label = root.querySelector('.' + BASE + '__label');
      var inner = root.querySelector('.' + BASE + '__reveal-inner');

      function span(cls, text) {
        var el = document.createElement('span');
        el.className = cls;
        if (text) el.textContent = text;
        return el;
      }

      // The custom properties the variant showing now put on the card, so the
      // next one can take them off again. Written on the component's own root
      // rather than on anything around it: the property block lives on that
      // element, and a declaration on the element beats one inherited from an
      // ancestor whatever the specificity of the rule that set it — a value
      // handed to a wrapper would be shadowed by the component's own default
      // and do nothing at all, silently.
      var vars = [];

      function apply(variant) {
        // Only the variant classes are touched, so --open survives a switch.
        VARIANTS.forEach(function (v) {
          v.classes.forEach(function (c) { root.classList.remove(BASE + c); });
        });
        variant.classes.forEach(function (c) { root.classList.add(BASE + c); });

        vars.forEach(function (name) { root.style.removeProperty(name); });
        vars = variant.vars ? Object.keys(variant.vars) : [];
        vars.forEach(function (name) {
          root.style.setProperty(name, variant.vars[name]);
        });

        // `tone` is read by ordered() to pick the resting card against the
        // rail, and by nothing else — it no longer paints a surround. The
        // ground is the rail's in every variant.

        title.textContent = variant.title;
        pill.textContent = variant.pill;

        // The label keeps its leading mark and swaps only the text after it.
        label.lastChild.textContent = variant.action;

        var pin = art.querySelector('.' + BASE + '__pin');
        if (variant.pin && !pin) art.appendChild(span(BASE + '__pin'));
        if (!variant.pin && pin) pin.remove();

        inner.textContent = '';
        if (variant.kicker) inner.appendChild(span(BASE + '__kicker', variant.kicker));
        variant.details.forEach(function (pair) {
          var group = span(BASE + '__detail');
          group.appendChild(span(BASE + '__line', pair[0]));
          group.appendChild(span(BASE + '__line ' + BASE + '__line--muted', pair[1]));
          inner.appendChild(group);
        });
        inner.appendChild(span(BASE + '__meta', variant.meta));
      }

      // The card at rest is the one the rail is NOT the colour of: the dark
      // card on a light rail, the light card on a dark one.
      //
      // It is an edge problem before it is a taste one. This component's
      // light card is #f2f1ef and the light rail's ground is #f3f2ef —
      // measured at 0.30 OK ΔE, which is to say the same colour, and the
      // card's own edge did no work at all. Every other answer was worse:
      // moving the shared ground trades this study's edge for another's,
      // since the five components in the set span OKL 92 to 100 and any one
      // ground lands on top of one of them; and a border added in the
      // preview would be the thumbnail reaching into the component, which
      // the contract forbids. Inverting spends nothing — a dark card is
      // already one of the things this study is.
      //
      // Rotated to the front rather than merely applied, because quick look
      // takes index 0 as what is showing: it opens on that dot and prints
      // that label. Applying one variant while reporting another as first
      // would leave the overlay naming the wrong card.
      // Every card of the facing tone leads, in the order they are authored,
      // and the rail's own tone follows. It was one card before the rotation
      // below existed; now the cards it steps through are the leading group,
      // so the edge argument covers all three rather than only the first.
      function ordered(dark) {
        var want = dark ? 'light' : 'dark';
        var facing = VARIANTS.filter(function (v) { return v.tone === want; });
        if (!facing.length) return VARIANTS.slice();
        return facing.concat(VARIANTS.filter(function (v) { return v.tone !== want; }));
      }

      function isDark() {
        return document.documentElement.getAttribute('data-theme') === 'dark';
      }

      var list = ordered(isDark());
      apply(list[0]);

      // --- the rail rotation ---------------------------------------------
      //
      // The card steps through the three variants facing the rail — the base
      // card, and the two locations — on a timer, and settles back to the
      // first. A thumbnail standing on one of them says the component is that
      // card; what this study is about is a panel that holds whatever the
      // card is for, and one variant cannot make that argument. The two
      // locations are what carries it: the same modifier, two places, so the
      // map reads as a frame rather than as a picture.
      //
      // It stays inside the facing tone because the inversion above is an
      // edge decision and it applies to every card in the cycle, not only to
      // the one at rest. Measured against the light ground, the light base
      // card is 0.30 OK dE and the light map 1.01 — both of them the same
      // colour as the paper, with nothing drawing the card's edge. Stepping
      // into either on a light rail would undo the thing the inversion is
      // for, three times a cycle.
      var CYCLE_MS = 7500;   // in the 6-8s band, and deliberately not the
                             // inked plate's 6500: two cards on one period
                             // restyle on one frame, every time.

      var reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
      var cycleTimer = 0;
      var cyclePos = 0;
      var held = false;    // the rail is moving, or this card is off screen
      var taken = false;   // a reader, or quick look, has asked for a variant

      // The leading group ordered() built — however many cards face the rail.
      function cycleLen() {
        var tone = list[0].tone;
        var n = 0;
        while (n < list.length && list[n].tone === tone) n++;
        return n;
      }

      // Two things end it outright. A reader who has asked for a variant
      // outranks it, and for good — this file is what quick look loads too,
      // and rotating under its dots would take the card they picked away from
      // them. And reduced motion, which is the whole of what this is: content
      // that changes on its own, unasked. Being held is neither, and the
      // block below is about the difference.
      // --- what holds a step, and what only defers it --------------------
      //
      // The rail pauses a card whenever it is off screen or the rail is
      // moving, and on a drifting rail that is most of a card's life:
      // measured on the live index over 70 seconds, this card was on screen
      // for 56 of them and unpaused for 31. A timer cleared on every pause
      // therefore counts unpaused time, and the card steps about once every
      // 23 seconds instead of every 6 to 8 — measured, three steps in that
      // 70 rather than ten.
      //
      // So the clock runs through the hold and only the swap waits. A step
      // that comes due while the card is held is taken when it is let go,
      // which on this rail is the moment the card arrives at the read mark —
      // one swap, not the several the hold was worth. Nothing restyles off
      // screen or under a finger, which is what the pause is for, and the
      // cadence is wall clock, which is what was asked for.
      //
      // SETTLE_MS is the gap before that deferred swap. Without it a card
      // swaps on the frame it arrives on, which is the frame the rail is
      // already handing off on — and a preview that came due while it was
      // still loading would change before its resting state had been seen at
      // all.
      var SETTLE_MS = 1200;

      var due = false;

      // The drift is deliberately not in this. A card held for the drift is on
      // screen and being carried past, which is the one case where a swap is
      // both worth making and safe: measured at 13 times the rate this steps
      // at — 100 swap events in 25 seconds against none — it moves no part of
      // the drift's frame distribution, at 1x or at 4x. A gesture must not
      // hitch and an off-screen card is work for nobody, so those two hold.
      //
      // What the drift still holds is animating, which is a per-frame cost and
      // a different question: `data-preview-paused` is set for all three.
      function heldNow() {
        return held || document.hidden;
      }

      function cycleStop() {
        clearTimeout(cycleTimer);
        cycleTimer = 0;
      }

      function cycleSoon(ms) {
        cycleStop();
        if (taken || reduced.matches) return;
        cycleTimer = setTimeout(function () {
          cycleTimer = 0;
          if (taken || reduced.matches) return;
          if (heldNow()) { due = true; return; }
          due = false;
          cyclePos = (cyclePos + 1) % cycleLen();
          apply(list[cyclePos]);
          cycleSoon(CYCLE_MS);
        }, ms);
      }

      // Let go of: the rail landed, the card came back on screen, or the tab
      // did. A step already due is taken a beat later.
      //
      // Otherwise the clock carries on *where it was*, which is the whole of
      // this function and easy to get wrong: rescheduling unconditionally
      // restarts the interval, and a card is let go of far more often than
      // every 6.5 seconds — under the drift it changes hands every time the
      // read mark moves. Measured with the naive version, the timer was reset
      // before it could ever fire and the card stepped 4 times in 70 seconds
      // rather than 8, which read exactly like the hold it was supposed to
      // have stopped being.
      function cycleRelease() {
        if (due) { cycleSoon(SETTLE_MS); return; }
        if (!cycleTimer) cycleSoon(CYCLE_MS);
      }

      window.addEventListener('message', function (event) {
        var data = event.data;
        if (!data || data.source !== CHANNEL) return;

        if (data.type === 'preview') {
          root.classList.toggle(BASE + '--open', data.active === true);
        }

        // The rail is moving under a finger, or stepping to a card. Everything
        // in here stops until it lands — see the paused rule in the style
        // block above. Resuming picks the animations up where they were
        // rather than restarting them, which is the point of pausing over
        // unloading.
        if (data.type === 'preview:pause') {
          // Animations stop for all three reasons; the rotation stops for two.
          // An index that predates `reason` sends none, and an absent reason
          // reads as held — the cautious way round.
          var frozen = data.paused === true;
          held = frozen && data.reason !== 'drift';
          if (frozen) {
            document.documentElement.setAttribute('data-preview-paused', '');
          } else {
            document.documentElement.removeAttribute('data-preview-paused');
          }
          // The paused rule in the style block is CSS and reaches animations
          // only; a timer is not an animation, so the rotation is held here.
          if (!held) cycleRelease();
        }

        // The index was switched while this thumbnail was on screen. The
        // ground moves, and so does which card rests on it — the inversion
        // above is about the rail's colour, so it has to answer a rail that
        // changes colour under a card already on screen.
        //
        // Only at rest. Quick look loads its own frame with ?theme= on the
        // src, so it is never the document being switched here; but a card
        // being driven through its variants has been asked for a particular
        // one, and re-resting it underneath that would take it away.
        if (data.type === 'preview:theme') {
          var dark = data.theme === 'dark';
          if (dark) {
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.removeAttribute('data-theme');
          }
          list = ordered(dark);
          if (!taken) {
            // Same position in the new facing group, so a card two steps into
            // its cycle stays two steps in rather than starting over. The
            // groups are the same size either way, and if they ever are not,
            // cycleLen() is what the next step reads.
            apply(list[cyclePos % cycleLen()]);
            due = false;
            cycleSoon(CYCLE_MS);
          }
        }

        // A reader has picked a card, or quick look's own autoplay has. Either
        // way the rotation is over for this document — it is not the index's
        // to fight, and this is the same file quick look loads. In practice
        // the overlay gets there first anyway: its autoplay steps at 4000ms
        // and nothing here moves before 7500.
        if (data.type === 'preview:variant') {
          taken = true;
          cycleStop();
          var variant = list[data.index];
          if (variant) apply(variant);
        }
      });

      // Announces the listener is live, so a hover that landed before this
      // file parsed is re-sent rather than lost — and hands the index the
      // labels it needs for the quick-look dots.
      // Quick look runs this file with pointer events live, so the pointer —
      // and with it the focus — ends up inside this document. Keys pressed
      // here fire against *this* document and never reach the index, which is
      // where the overlay's Escape handler lives: click the component, press
      // Escape, and nothing happens. So the one key the overlay owns is handed
      // back across the channel. Only Escape. Anything else is the component's
      // to interpret — arrows move a caret in a field the component may have.
      if (window.parent !== window) {
        document.addEventListener('keydown', function (event) {
          if (event.key !== 'Escape') return;
          window.parent.postMessage({ source: CHANNEL, type: 'preview:key', key: 'Escape' }, '*');
        });
      }

      if (window.parent !== window) {
        window.parent.postMessage({
          source: CHANNEL,
          type: 'preview:ready',
          variants: list.map(function (v) { return { id: v.id, label: v.label }; })
        }, '*');
      }

      // Framed only, so a file opened on its own still shows exactly what its
      // markup says — the same claim the rest of this script makes.
      if (window.parent !== window) {
        document.addEventListener('visibilitychange', function () {
          if (!document.hidden) cycleRelease();
        });
        if (reduced.addEventListener) {
          reduced.addEventListener('change', function () {
            if (reduced.matches) cycleStop();
            else cycleSoon(CYCLE_MS);
          });
        }
        cycleSoon(CYCLE_MS);
      }
    })();
  </script>

</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2026-09-detail-reveal-card — preview</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap">

  <link rel="stylesheet" href="component.css">


  <!-- The ground, before the first paint. The index loads this frame with
     ?theme= on the src, so a thumbnail is never drawn on the wrong one and
     then corrected. Opened on its own, with no query, it keeps the light
     ground. -->
  <script>
    var theme = new URLSearchParams(location.search).get('theme');
    if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  </script>

  <style>
    /* Thumbnail scaffolding only — one instance, centred, no captions.
       Nothing here names a component class. */
    /* <html> carries a background purely so <body>'s stops propagating to the
       viewport canvas. The surround is deliberately not transitioned: inside
       the framed document a background-color transition stalls part-way and
       leaves it a muddy grey between the two tones. The card's own motion is
       what this page is showing; the backdrop can just cut. */
    /* The shared ground, and the only colour this page writes. Both values are
       literals repeated in every folder rather than shared from anywhere — the
       folder has to survive being copied out — but they have to be the same
       two numbers in all of them, or the rail stops reading as one set of
       cards. That is what this ground is for: it is the rail's, not the
       component's, which is why it follows the index into dark rather than
       staying lit under it. The index says which over ?theme= on the src and
       the preview:theme message; the script at the foot of the file listens. */
    :root { --preview-ground: #f3f2ef; }
    :root[data-theme="dark"] { --preview-ground: #191b1e; }

    html { background-color: var(--preview-ground); }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background-color: var(--preview-ground);
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
    }

    /* The dark card used to bring a #101216 surround with it, on the argument
       that the tone is the variant's rather than the page's. It is gone, and
       the ground above is the only one this file writes.

       It survived the sweep that took the inked plate's plotter grid off its
       thumbnail because it was never visible on the rail: the resting card
       was the light one, so the rule only ever fired inside quick look. The
       moment the resting card became the dark one — see the script — it would
       have fired on the card, and card 04 would have been the single card in
       a light rail carrying its own dark ground. That is the thing the shared
       ground exists to prevent, and it does not stop being that because the
       surface is the variant's own.

       Nothing is lost by it. A dark plate on paper is what the inversion is
       for: it is the widest separation this study's edge has ever had, where
       on its own ground the plate met a backdrop three ΔE away. */

    /* The index has told this thumbnail that the rail is moving under a
       finger. Every animation in the document stops for the length of the
       gesture and picks up where it left off.

       It is here rather than in the component because it is the rail's
       problem, not the study's: a same-origin iframe shares the index's main
       thread, so a card that keeps animating while it is being dragged is
       animating against the drag, on the same thread the drag needs. Measured
       across the whole rail: 80 dropped frames in a two-card drag against 20
       with this in.

       Global on purpose. It has to reach the component without naming a
       single one of its classes — the same rule the rest of this file keeps.
       Transitions are deliberately left out: stopping those mid-gesture makes
       states snap instead of settle, and they are not what costs. */
    :root[data-preview-paused] *,
    :root[data-preview-paused] *::before,
    :root[data-preview-paused] *::after {
      animation-play-state: paused !important;
    }
  </style>
</head>
<body>
  <a class="detail-reveal-card" href="#" tabindex="-1">
    <span class="detail-reveal-card__art" aria-hidden="true"></span>
    <span class="detail-reveal-card__header">
      <span class="detail-reveal-card__title">Field Notes</span>
      <span class="detail-reveal-card__pill">Issue 04</span>
    </span>
    <span class="detail-reveal-card__panel">
      <span class="detail-reveal-card__row">
        <span class="detail-reveal-card__label">
          <span class="detail-reveal-card__mark" aria-hidden="true">&#8594;</span>Read the essay
        </span>
        <svg class="detail-reveal-card__arrow" viewBox="0 0 16 16" fill="none"
             stroke="currentColor" stroke-width="1.3" aria-hidden="true">
          <path d="M4 12 12 4M6 4h6v6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </span>
      <span class="detail-reveal-card__reveal">
        <span class="detail-reveal-card__reveal-inner">
          <span class="detail-reveal-card__detail">
            <span class="detail-reveal-card__line">On details that survive a redesign</span>
            <span class="detail-reveal-card__line detail-reveal-card__line--muted">18 pages, illustrated</span>
          </span>
          <span class="detail-reveal-card__detail">
            <span class="detail-reveal-card__line">Published March 2026</span>
            <span class="detail-reveal-card__line detail-reveal-card__line--muted">Written in the studio</span>
          </span>
          <span class="detail-reveal-card__meta">Free &middot; 12 min read</span>
        </span>
      </span>
    </span>
  </a>

  <!--
    Thumbnail scaffolding only. Two jobs, both driven by the index and both
    inert when this file is opened on its own:

      1. A card's iframe has pointer events off, so the component's :hover can
         never fire there. The index says when a card is being looked at and
         this file decides what that means — here, the --open modifier.
      2. Quick look asks for the component's variants and steps through them.
         The list lives here, because the index must never name a component
         class. It reports labels; the index just draws dots.

    The base markup above matches component.html. The pin and the kicker are
    built here rather than sitting in the markup, because --map is the only
    variant that wants them, and __kicker sets `display: block` — an author
    rule the `hidden` attribute would lose to.
  -->
  <script>
    (function () {
      var CHANNEL = 'interface-studies';
      var root = document.querySelector('.detail-reveal-card');
      if (!root) return;

      var BASE = 'detail-reveal-card';

      var VARIANTS = [
        {
          id: 'light', label: 'Light', tone: 'light', classes: [], pin: false,
          title: 'Field Notes', pill: 'Issue 04', action: 'Read the essay',
          details: [
            ['On details that survive a redesign', '18 pages, illustrated'],
            ['Published March 2026', 'Written in the studio']
          ],
          meta: 'Free \u00b7 12 min read'
        },
        {
          id: 'dark', label: 'Dark', tone: 'dark', classes: ['--dark'], pin: false,
          title: 'Changelog', pill: 'v2.4', action: 'See what shipped',
          details: [
            ['Keyboard navigation everywhere', 'Eleven fixes, two new panels'],
            ['Released this week', 'No migration needed']
          ],
          meta: '18 commits \u00b7 4 contributors'
        },
        {
          id: 'map', label: 'Location', tone: 'light', classes: ['--map'], pin: true,
          title: 'Denmark', pill: 'GMT+2', action: 'Copenhagen',
          kicker: '55.6761\u00b0 N \u00b7 12.5683\u00b0 E',
          details: [
            ['14 Placeholder Street', '1050 Copenhagen K'],
            ['+45 00 00 00 00', 'hello@example.com']
          ],
          meta: '86 people \u00b7 Est. 2019'
        },
        {
          id: 'map-dark', label: 'Location, dark', tone: 'dark',
          classes: ['--map', '--dark'], pin: true,
          title: 'Denmark', pill: 'GMT+2', action: 'Copenhagen',
          kicker: '55.6761\u00b0 N \u00b7 12.5683\u00b0 E',
          details: [
            ['14 Placeholder Street', '1050 Copenhagen K'],
            ['+45 00 00 00 00', 'hello@example.com']
          ],
          meta: '86 people \u00b7 Est. 2019'
        }
      ];

      var art = root.querySelector('.' + BASE + '__art');
      var title = root.querySelector('.' + BASE + '__title');
      var pill = root.querySelector('.' + BASE + '__pill');
      var label = root.querySelector('.' + BASE + '__label');
      var inner = root.querySelector('.' + BASE + '__reveal-inner');

      function span(cls, text) {
        var el = document.createElement('span');
        el.className = cls;
        if (text) el.textContent = text;
        return el;
      }

      // What is showing, so a theme switch can tell a card at rest from one
      // quick look has stepped somewhere.
      var current = null;

      function apply(variant) {
        current = variant;
        // Only the variant classes are touched, so --open survives a switch.
        VARIANTS.forEach(function (v) {
          v.classes.forEach(function (c) { root.classList.remove(BASE + c); });
        });
        variant.classes.forEach(function (c) { root.classList.add(BASE + c); });

        // `tone` is read by ordered() to pick the resting card against the
        // rail, and by nothing else — it no longer paints a surround. The
        // ground is the rail's in every variant.

        title.textContent = variant.title;
        pill.textContent = variant.pill;

        // The label keeps its leading mark and swaps only the text after it.
        label.lastChild.textContent = variant.action;

        var pin = art.querySelector('.' + BASE + '__pin');
        if (variant.pin && !pin) art.appendChild(span(BASE + '__pin'));
        if (!variant.pin && pin) pin.remove();

        inner.textContent = '';
        if (variant.kicker) inner.appendChild(span(BASE + '__kicker', variant.kicker));
        variant.details.forEach(function (pair) {
          var group = span(BASE + '__detail');
          group.appendChild(span(BASE + '__line', pair[0]));
          group.appendChild(span(BASE + '__line ' + BASE + '__line--muted', pair[1]));
          inner.appendChild(group);
        });
        inner.appendChild(span(BASE + '__meta', variant.meta));
      }

      // The card at rest is the one the rail is NOT the colour of: the dark
      // card on a light rail, the light card on a dark one.
      //
      // It is an edge problem before it is a taste one. This component's
      // light card is #f2f1ef and the light rail's ground is #f3f2ef —
      // measured at 0.30 OK ΔE, which is to say the same colour, and the
      // card's own edge did no work at all. Every other answer was worse:
      // moving the shared ground trades this study's edge for another's,
      // since the five components in the set span OKL 92 to 100 and any one
      // ground lands on top of one of them; and a border added in the
      // preview would be the thumbnail reaching into the component, which
      // the contract forbids. Inverting spends nothing — a dark card is
      // already one of the things this study is.
      //
      // Rotated to the front rather than merely applied, because quick look
      // takes index 0 as what is showing: it opens on that dot and prints
      // that label. Applying one variant while reporting another as first
      // would leave the overlay naming the wrong card.
      function ordered(dark) {
        var want = dark ? 'light' : 'dark';
        var rest = VARIANTS.filter(function (v) { return v.tone === want; })[0];
        if (!rest) return VARIANTS.slice();
        return [rest].concat(VARIANTS.filter(function (v) { return v !== rest; }));
      }

      function isDark() {
        return document.documentElement.getAttribute('data-theme') === 'dark';
      }

      var list = ordered(isDark());
      apply(list[0]);

      window.addEventListener('message', function (event) {
        var data = event.data;
        if (!data || data.source !== CHANNEL) return;

        if (data.type === 'preview') {
          root.classList.toggle(BASE + '--open', data.active === true);
        }

        // The rail is moving under a finger, or stepping to a card. Everything
        // in here stops until it lands — see the paused rule in the style
        // block above. Resuming picks the animations up where they were
        // rather than restarting them, which is the point of pausing over
        // unloading.
        if (data.type === 'preview:pause') {
          if (data.paused === true) {
            document.documentElement.setAttribute('data-preview-paused', '');
          } else {
            document.documentElement.removeAttribute('data-preview-paused');
          }
        }

        // The index was switched while this thumbnail was on screen. The
        // ground moves, and so does which card rests on it — the inversion
        // above is about the rail's colour, so it has to answer a rail that
        // changes colour under a card already on screen.
        //
        // Only at rest. Quick look loads its own frame with ?theme= on the
        // src, so it is never the document being switched here; but a card
        // being driven through its variants has been asked for a particular
        // one, and re-resting it underneath that would take it away.
        if (data.type === 'preview:theme') {
          var dark = data.theme === 'dark';
          if (dark) {
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.removeAttribute('data-theme');
          }
          var resting = current === list[0];
          list = ordered(dark);
          if (resting) apply(list[0]);
        }

        if (data.type === 'preview:variant') {
          var variant = list[data.index];
          if (variant) apply(variant);
        }
      });

      // Announces the listener is live, so a hover that landed before this
      // file parsed is re-sent rather than lost — and hands the index the
      // labels it needs for the quick-look dots.
      // Quick look runs this file with pointer events live, so the pointer —
      // and with it the focus — ends up inside this document. Keys pressed
      // here fire against *this* document and never reach the index, which is
      // where the overlay's Escape handler lives: click the component, press
      // Escape, and nothing happens. So the one key the overlay owns is handed
      // back across the channel. Only Escape. Anything else is the component's
      // to interpret — arrows move a caret in a field the component may have.
      if (window.parent !== window) {
        document.addEventListener('keydown', function (event) {
          if (event.key !== 'Escape') return;
          window.parent.postMessage({ source: CHANNEL, type: 'preview:key', key: 'Escape' }, '*');
        });
      }

      if (window.parent !== window) {
        window.parent.postMessage({
          source: CHANNEL,
          type: 'preview:ready',
          variants: list.map(function (v) { return { id: v.id, label: v.label }; })
        }, '*');
      }
    })();
  </script>

</body>
</html>

<!doctype html>
<!--
  The thumbnail the landing page iframes: one instance of the board, centred on
  the rail's shared ground, with no captions and no second copy. It links
  component.css and never redefines it.

  Keep the markup below in step with component.html.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bento grid &mdash; preview</title>

  <link rel="stylesheet" href="component.css">

  <!-- The ground, before the first paint. The index loads this frame with
       ?theme= on the src, so a thumbnail is never drawn on the wrong one and
       then corrected. -->
  <script>
    var theme = new URLSearchParams(location.search).get('theme');
    if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  </script>

  <style>
    /* Thumbnail scaffolding only. Nothing here may name a component class. */

    /* The rail's ground, not this study's — two literals repeated in every
       folder so the row reads as one set of cards, which is why it follows the
       index into dark rather than staying lit under it. Nothing is painted on
       top of them. */
    :root { --preview-ground: #f3f2ef; }
    :root[data-theme="dark"] { --preview-ground: #191b1e; }

    html { background-color: var(--preview-ground); }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.25rem;
      box-sizing: border-box;
      background-color: var(--preview-ground);
      font-family: system-ui, sans-serif;
    }

    /* The board is given the frame's width to reflow against. `min-width: 0`
       because a grid item's automatic minimum is its content, and without it
       the board would be as wide as its widest tile wants to be. */
    .preview-stage {
      width: 100%;
      min-width: 0;
      max-width: 100%;
    }

    /* The rail is moving, so every animation in here stops and picks up where
       it left off. Global on purpose: it has to reach the component without
       naming one of its classes. Transitions are left out deliberately —
       stopping those mid-gesture makes states snap instead of settle. */
    :root[data-preview-paused] *,
    :root[data-preview-paused] *::before,
    :root[data-preview-paused] *::after {
      animation-play-state: paused !important;
    }
  </style>
</head>
<body>
  <div class="preview-stage">

    <div class="bento-grid">
      <ul class="bento-grid__board">

        <li class="bento-grid__tile bento-grid__tile--feature">
          <p class="bento-grid__label">Plate 01</p>
          <h3 class="bento-grid__title">Burnt Umber</h3>
          <div class="bento-grid__foot">
            <p class="bento-grid__meta">#6B5844</p>
            <p class="bento-grid__meta">Matte &middot; opaque</p>
          </div>
        </li>

        <li class="bento-grid__tile bento-grid__tile--wide">
          <h3 class="bento-grid__label">Tone ladder</h3>
          <div class="bento-grid__ramp" role="img" aria-label="Seven tones mixed from the plate pigment, lightest to full strength">
            <span class="bento-grid__step"></span>
            <span class="bento-grid__step"></span>
            <span class="bento-grid__step"></span>
            <span class="bento-grid__step"></span>
            <span class="bento-grid__step"></span>
            <span class="bento-grid__step"></span>
            <span class="bento-grid__step"></span>
          </div>
          <div class="bento-grid__foot">
            <p class="bento-grid__meta">7 steps</p>
            <p class="bento-grid__meta">Oklab</p>
          </div>
        </li>

        <li class="bento-grid__tile bento-grid__tile--tall">
          <h3 class="bento-grid__label">Grain</h3>
          <div class="bento-grid__grain">
            <div class="bento-grid__grain-row">
              <p class="bento-grid__meta">Coarse</p>
              <div class="bento-grid__hatch bento-grid__hatch--coarse"></div>
            </div>
            <div class="bento-grid__grain-row">
              <p class="bento-grid__meta">Medium</p>
              <div class="bento-grid__hatch bento-grid__hatch--medium"></div>
            </div>
            <div class="bento-grid__grain-row">
              <p class="bento-grid__meta">Fine</p>
              <div class="bento-grid__hatch bento-grid__hatch--fine"></div>
            </div>
          </div>
        </li>

        <li class="bento-grid__tile">
          <h3 class="bento-grid__label">Weight</h3>
          <div class="bento-grid__foot">
            <p class="bento-grid__figure">180</p>
            <p class="bento-grid__meta">gsm</p>
          </div>
        </li>

        <li class="bento-grid__tile">
          <h3 class="bento-grid__label">Mark</h3>
          <svg class="bento-grid__mark" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true" focusable="false">
            <circle cx="24" cy="24" r="21" stroke-dasharray="99 33" stroke-linecap="round" />
            <circle cx="24" cy="24" r="14" stroke-dasharray="66 22" stroke-linecap="round" transform="rotate(120 24 24)" />
            <circle cx="24" cy="24" r="7" stroke-dasharray="33 11" stroke-linecap="round" transform="rotate(240 24 24)" />
          </svg>
        </li>

        <li class="bento-grid__tile">
          <h3 class="bento-grid__label">Sheets</h3>
          <div class="bento-grid__foot">
            <p class="bento-grid__figure">24</p>
            <p class="bento-grid__meta">in stock</p>
          </div>
        </li>

        <li class="bento-grid__tile">
          <h3 class="bento-grid__label">Mix</h3>
          <div class="bento-grid__mix" role="img" aria-label="Four chips crossing the plate pigment with the accent">
            <span class="bento-grid__chip"></span>
            <span class="bento-grid__chip"></span>
            <span class="bento-grid__chip"></span>
            <span class="bento-grid__chip"></span>
          </div>
        </li>

      </ul>
    </div>

  </div>

  <!--
    Thumbnail scaffolding, driven by the index and inert when this file is
    opened on its own.

    What `active` means here is the board stepping its own column ladder. For a
    study whose whole subject is what the arrangement does when it loses a
    column, that is the one thing a still card cannot show — so being read is
    what makes it show it, and at rest the board is simply a board.

    The variants are the rungs, held. Quick look opens on index 0, which is the
    resting one: three columns, which is also what the board's own container
    query hands it at this frame's width. Picking any variant drops the
    cycling, because asking for a rung and watching it move are different
    questions.
  -->
  <script>
    (function () {
      var CHANNEL = 'interface-studies';
      var root = document.querySelector('.bento-grid');
      var board = document.querySelector('.bento-grid__board');
      if (!root || !board) return;

      // First entry is the resting state, and it is what the card shows.
      var VARIANTS = [
        { id: 'three', label: 'Three columns', cols: 3 },
        { id: 'four',  label: 'Four columns',  cols: 4 },
        { id: 'two',   label: 'Two columns',   cols: 2 },
        { id: 'one',   label: 'One column',    cols: 1 }
      ];

      function apply(variant) {
        // A rung is a held state, so the ladder stops while one is being held.
        root.classList.remove('bento-grid--cycling');
        board.style.setProperty('--bento-grid-cols', variant.cols);
      }

      apply(VARIANTS[0]);

      // How much this document's pixels are being shrunk on screen. The board
      // draws two things in device pixels — the tile hairline and the hatch —
      // and below one device pixel they stop being antialiased and start being
      // a smear. Restated inline against the factor, which is what beats the
      // stylesheet without writing a rule against a component class.
      function scale(n) {
        if (!n || n >= 1) {
          root.style.removeProperty('--bento-grid-line-weight');
          root.style.removeProperty('--bento-grid-hatch-weight');
          return;
        }
        var px = (1 / n).toFixed(2) + 'px';
        root.style.setProperty('--bento-grid-line-weight', px);
        root.style.setProperty('--bento-grid-hatch-weight', px);
      }

      window.addEventListener('message', function (event) {
        var data = event.data;
        if (!data || data.source !== CHANNEL) return;

        if (data.type === 'preview') {
          root.classList.toggle('bento-grid--cycling', data.active === true);
        }

        if (data.type === 'preview:variant') {
          var variant = VARIANTS[data.index];
          if (variant) apply(variant);
        }

        if (data.type === 'preview:scale') {
          scale(data.scale);
        }

        // The rail is moving, or this card has left the scrollport.
        if (data.type === 'preview:pause') {
          if (data.paused === true) {
            document.documentElement.setAttribute('data-preview-paused', '');
          } else {
            document.documentElement.removeAttribute('data-preview-paused');
          }
        }

        // Which theme the index is in. The ground above is the rail's rather
        // than this study's, and every thumbnail moves with the page together
        // or the rail stops reading as one set of cards.
        if (data.type === 'preview:theme') {
          if (data.theme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.removeAttribute('data-theme');
          }
        }
      });

      // Quick look runs this file with pointer events live, so focus can end
      // up inside this document and the overlay's Escape handler never hears
      // the key. Hand back that one key and nothing else — arrows belong to
      // whatever the component might be holding.
      if (window.parent !== window) {
        document.addEventListener('keydown', function (event) {
          if (event.key !== 'Escape') return;
          window.parent.postMessage({ source: CHANNEL, type: 'preview:key', key: 'Escape' }, '*');
        });

        window.parent.postMessage({
          source: CHANNEL,
          type: 'preview:ready',
          variants: VARIANTS.map(function (v) { return { id: v.id, label: v.label }; })
        }, '*');
      }
    })();
  </script>

</body>
</html>

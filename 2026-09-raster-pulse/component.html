<!--
  2026-09-raster-pulse — the component markup, and nothing else.

  One <i> per grid cell, carrying nothing but its coordinate in a field that
  runs -8..8 on both axes with 0,0 at the centre. component.css derives
  everything else from those two numbers — shape membership, tone, and the
  dot's place in the travelling pulse — so a pattern is a modifier on the root
  and never a second copy of this grid.

  The rows are one line each on purpose: the source reads as the raster it is,
  and a coordinate is checkable against its position in the line.

  Change --raster-pulse-cols in component.css and this grid has to be
  regenerated to match, along with --reach and --diag.
-->

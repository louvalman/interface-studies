<!doctype html>
<!--
  The thumbnail the landing page iframes: one instance of the component,
  centred on the demo's background, with no captions and no other states.

  It links component.css and never redefines it. The one value it does set is
  --raster-pulse-width, and it is set inline on the root rather than from a
  rule in the scaffolding below: the tunable block lives on .raster-pulse
  itself, so an inherited value from `body` would lose to it — the tunable
  contract is entered from the element or from a rule that outranks that one,
  and the scaffolding may not name a component class. At its own 22rem the
  poster stood 564px tall in the 480x600 frame and read as cropped; every
  footer metric is a cqw ratio, so one width scales the whole poster.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2026-09-raster-pulse &mdash; preview</title>

  <!-- Same font loading as demo.html. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">

  <link rel="stylesheet" href="component.css">


  <!-- The ground, before the first paint. The index loads this frame with
     ?theme= on the src, so a thumbnail is never drawn on the wrong one and
     then corrected. Opened on its own, with no query, it keeps the light
     ground. -->
  <script>
    var theme = new URLSearchParams(location.search).get('theme');
    if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  </script>

  <style>
    /* Thumbnail scaffolding only. Nothing here names a component class. */
    /* The same ground every study in this repo sits on, and the same one
       demo.html uses. Repeated as a literal rather than shared, because the
       folder has to survive being copied out — but it has to be the same
       number in all of them, or the rail stops reading as one set of cards.
       <html> carries it too, so <body>'s background does not propagate to the
       viewport canvas and leave a seam at the frame edge. */
    /* The shared ground, and the only colour this page writes. Both values are
       literals repeated in every folder rather than shared from anywhere — the
       folder has to survive being copied out — but they have to be the same
       two numbers in all of them, or the rail stops reading as one set of
       cards. That is what this ground is for: it is the rail's, not the
       component's, which is why it follows the index into dark rather than
       staying lit under it. The index says which over ?theme= on the src and
       the preview:theme message; the script at the foot of the file listens. */
    :root { --preview-ground: #f3f2ef; }
    :root[data-theme="dark"] { --preview-ground: #191b1e; }

    html { background-color: var(--preview-ground); }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background-color: var(--preview-ground);
      font-family: "Space Grotesk", system-ui, sans-serif;
    }
  
    /* The index has told this thumbnail that the rail is moving under a
       finger. Every animation in the document stops for the length of the
       gesture and picks up where it left off.

       It is here rather than in the component because it is the rail's
       problem, not the study's: a same-origin iframe shares the index's main
       thread, so a card that keeps animating while it is being dragged is
       animating against the drag, on the same thread the drag needs. Measured
       across the whole rail: 80 dropped frames in a two-card drag against 20
       with this in.

       Global on purpose. It has to reach the component without naming a
       single one of its classes — the same rule the rest of this file keeps.
       Transitions are deliberately left out: stopping those mid-gesture makes
       states snap instead of settle, and they are not what costs. */
    :root[data-preview-paused] *,
    :root[data-preview-paused] *::before,
    :root[data-preview-paused] *::after {
      animation-play-state: paused !important;
    }
  </style>
</head>

  <!--
    Thumbnail scaffolding only. Two jobs, both driven by the index and both
    inert when this file is opened on its own:

      1. A card's iframe has pointer events off, so the component's :hover can
         never fire there. The index says when a card is being looked at and
         this file decides what that means — here, --open, which is the same
         state hover reaches: the pulse speeds up and carries the second tone.
      2. Quick look steps through the patterns. The list lives here because the
         index must never name a component class; it is handed labels and draws
         dots.

    Each pattern is one class on the root and nothing else — no markup is
    added, removed or rewritten, because the 289 dots carry only coordinates
    and component.css derives the shape from them.
  -->
  <script>
    (function () {
      var CHANNEL = 'interface-studies';
      var root = document.querySelector('.raster-pulse');
      if (!root) return;

      // First entry is the resting state, and it is what the card shows.
      // The light halftone leads rather than the component's own default,
      // because it is the one pattern that reads at thumbnail size against
      // the off-white the rail puts behind every card.
      var VARIANTS = [
        { id: 'halftone', label: 'Halftone disc', classes: ['raster-pulse--halftone'] },
        { id: 'rings', label: 'Ring field', classes: [] },
        { id: 'pinwheel', label: 'Pinwheel', classes: ['raster-pulse--pinwheel'] },
        { id: 'moire', label: 'Interference', classes: ['raster-pulse--moire'] },
        { id: 'scan', label: 'Scan', classes: ['raster-pulse--scan'] }
      ];

      function apply(variant) {
        VARIANTS.forEach(function (v) {
          v.classes.forEach(function (c) { root.classList.remove(c); });
        });
        variant.classes.forEach(function (c) { root.classList.add(c); });
      }

      window.addEventListener('message', function (event) {
        var data = event.data;
        if (!data || data.source !== CHANNEL) return;

        if (data.type === 'preview') {
          root.classList.toggle('raster-pulse--open', data.active === true);
        }

        // The index was switched while this thumbnail was on screen. Only the
        // ground moves: the component is not touched, and it is the same
        // component in both themes.
        // The rail is moving under a finger, or stepping to a card. Everything
        // in here stops until it lands — see the paused rule in the style
        // block above. Resuming picks the animations up where they were
        // rather than restarting them, which is the point of pausing over
        // unloading.
        if (data.type === 'preview:pause') {
          if (data.paused === true) {
            document.documentElement.setAttribute('data-preview-paused', '');
          } else {
            document.documentElement.removeAttribute('data-preview-paused');
          }
        }

        if (data.type === 'preview:theme') {
          if (data.theme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.removeAttribute('data-theme');
          }
        }

        if (data.type === 'preview:variant') {
          var variant = VARIANTS[data.index];
          if (variant) apply(variant);
        }
      });

      // The resting variant is applied from here rather than written into the
      // markup above, so this file's <article> stays byte-identical to
      // component.html — the contract is the component's default, and which
      // of its patterns the thumbnail happens to lead with is this file's
      // business.
      apply(VARIANTS[0]);

      // Quick look runs this file with pointer events live, so the pointer —
      // and with it the focus — ends up inside this document. Keys pressed
      // here fire against *this* document and never reach the index, which is
      // where the overlay's Escape handler lives: click the component, press
      // Escape, and nothing happens. So the one key the overlay owns is handed
      // back across the channel. Only Escape. Anything else is the component's
      // to interpret — arrows move a caret in a field the component may have.
      if (window.parent !== window) {
        document.addEventListener('keydown', function (event) {
          if (event.key !== 'Escape') return;
          window.parent.postMessage({ source: CHANNEL, type: 'preview:key', key: 'Escape' }, '*');
        });
      }

      if (window.parent !== window) {
        window.parent.postMessage({
          source: CHANNEL,
          type: 'preview:ready',
          variants: VARIANTS.map(function (v) { return { id: v.id, label: v.label }; })
        }, '*');
      }
    })();
  </script>

<!doctype html>
<!--
  The thumbnail the landing page iframes: one instance of the component on the
  rail's shared ground, no captions and no second copy.

  A sound study is the one kind that cannot demonstrate itself here. A card's
  iframe has pointer events off, so nothing can arm the audio — and even in
  quick look, where the pointer is live and it genuinely can be armed, a rail
  that made a noise on approach would be indefensible. So what a card shows is
  the set striking its own pads in silence: `--live` is a keyframe clock on the
  rack whose every beat is an ordinary strike, timed from the set's own
  --spread, --attack and --decay. A paused animation fires no iterations, which
  is what lets the index stop the whole thing with one animation-play-state
  rule while the rail is being dragged.

  The three variants are the two axes of the token block, moved one at a time:
  `--hushed` keeps every interval and changes only the envelope, `--close`
  keeps the envelope and changes only the tuning. Both are token overrides, so
  the component's own MutationObserver re-reads them and the read-out prints
  the new values — which is the study demonstrating its own argument.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Struck tones &mdash; preview</title>

  <!-- Font loading is this file's job as it is the demo page's: the
       component names its families and falls back without them, but the
       thumbnail is where most people see it. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&family=JetBrains+Mono:wght@400&display=swap">

  <link rel="stylesheet" href="component.css">

  <!-- The ground, before the first paint. -->
  <script>
    var theme = new URLSearchParams(location.search).get('theme');
    if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  </script>

  <style>
    /* Thumbnail scaffolding only. Nothing here may name a component class. */

    /* The rail's ground, not this study's — two literals repeated in every
       folder so the row reads as one set of cards. */
    :root { --preview-ground: #f3f2ef; }
    :root[data-theme="dark"] { --preview-ground: #191b1e; }

    html { background-color: var(--preview-ground); }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background-color: var(--preview-ground);
      font-family: system-ui, sans-serif;
    }

    /* The rail is moving. Everything in here stops until it lands, and picks
       up where it left off rather than starting over. */
    :root[data-preview-paused] *,
    :root[data-preview-paused] *::before,
    :root[data-preview-paused] *::after {
      animation-play-state: paused !important;
    }
  </style>
</head>
<body>

  <section class="struck-tones" aria-label="Sound palette" data-shown="tap">
    <header class="struck-tones__head">
      <p class="struck-tones__label">Struck tones</p>
      <button class="struck-tones__arm" type="button" data-arm aria-pressed="false" disabled>
        <span class="struck-tones__arm-dot" aria-hidden="true"></span>
        <span class="struck-tones__arm-text" data-arm-text>Sound off</span>
      </button>
    </header>
    <div class="struck-tones__trace">
      <canvas class="struck-tones__screen" data-screen aria-hidden="true"></canvas>
      <div class="struck-tones__trace-top">
        <p class="struck-tones__trace-name" data-trace-name>Tap</p>
        <p class="struck-tones__trace-lag" data-trace-lag>one note</p>
      </div>
      <p class="struck-tones__trace-freq">
        <span class="struck-tones__trace-from" data-trace-from></span>
        <span data-trace-freq>528</span>
        <span class="struck-tones__trace-unit">Hz</span>
      </p>
      <div class="struck-tones__envelope" aria-hidden="true">
        <span class="struck-tones__env-note">
          <span class="struck-tones__env-rise"></span>
          <span class="struck-tones__env-fall"></span>
          <span class="struck-tones__env-rest"></span>
        </span>
        <span class="struck-tones__env-note struck-tones__env-note--second">
          <span class="struck-tones__env-lead"></span>
          <span class="struck-tones__env-rise"></span>
          <span class="struck-tones__env-fall"></span>
          <span class="struck-tones__env-rest"></span>
        </span>
      </div>
      <p class="struck-tones__trace-shape">
        <span data-trace-attack>16</span> ms rise &middot;
        <span data-trace-decay>820</span> ms fall
      </p>
      <p class="struck-tones__sr" data-trace-live role="status" aria-live="polite"></p>
    </div>
    <div class="struck-tones__rack">
      <button class="struck-tones__pad" type="button" data-tone="tap">
        <span class="struck-tones__contour" aria-hidden="true">
          <span class="struck-tones__note"></span>
        </span>
        <span class="struck-tones__pad-name">Tap</span>
        <span class="struck-tones__pad-step" data-step aria-hidden="true">0</span>
      </button>
      <button class="struck-tones__pad" type="button" data-tone="commit">
        <span class="struck-tones__contour" aria-hidden="true">
          <span class="struck-tones__note"></span>
          <span class="struck-tones__note"></span>
        </span>
        <span class="struck-tones__pad-name">Commit</span>
        <span class="struck-tones__pad-step" data-step aria-hidden="true">+7</span>
      </button>
      <button class="struck-tones__pad" type="button" data-tone="revert">
        <span class="struck-tones__contour" aria-hidden="true">
          <span class="struck-tones__note"></span>
          <span class="struck-tones__note"></span>
        </span>
        <span class="struck-tones__pad-name">Revert</span>
        <span class="struck-tones__pad-step" data-step aria-hidden="true">&minus;5</span>
      </button>
      <button class="struck-tones__pad" type="button" data-tone="alert">
        <span class="struck-tones__contour" aria-hidden="true">
          <span class="struck-tones__note"></span>
          <span class="struck-tones__note"></span>
        </span>
        <span class="struck-tones__pad-name">Alert</span>
        <span class="struck-tones__pad-step" data-step aria-hidden="true">&minus;1</span>
      </button>
    </div>
    <dl class="struck-tones__sheet">

        <dd class="struck-tones__glyph struck-tones__glyph--tuning" aria-hidden="true">
          <span class="struck-tones__keys"></span>
          <span class="struck-tones__led" data-led="tap"></span>
          <span class="struck-tones__led" data-led="commit"></span>
          <span class="struck-tones__led" data-led="revert"></span>
          <span class="struck-tones__led" data-led="alert"></span>
        </dd>
        <dd class="struck-tones__value" data-token="root">528 Hz</dd>
      </div>

        <dd class="struck-tones__glyph struck-tones__glyph--voice" aria-hidden="true">

        </dd>
        <dd class="struck-tones__value" data-token="voice">sine 2&times; 3&times;</dd>
      </div>
      <div class="struck-tones__module">
        <dt class="struck-tones__module-name">Strike</dt>

      </div>
      <div class="struck-tones__module">
        <dt class="struck-tones__module-name">Room</dt>
        <dd class="struck-tones__glyph struck-tones__glyph--room" aria-hidden="true">
          <span class="struck-tones__room-dry"></span>

  </section>

  <script src="component.js"></script>

  <script>
    (function () {
      var CHANNEL = 'interface-studies';
      var root = document.querySelector('.struck-tones');
      if (!root) return;

      /* First entry is the resting state the card shows. The two after it move
         one axis of the token block each, which is the thing worth stepping
         through in quick look. */
      var VARIANTS = [
        { id: 'struck', label: 'Struck', classes: [] },
        { id: 'hushed', label: 'Hushed envelope', classes: ['struck-tones--hushed'] },
        { id: 'close', label: 'Close tuning', classes: ['struck-tones--close'] }
      ];

      function apply(variant) {
        VARIANTS.forEach(function (v) {
          v.classes.forEach(function (c) { root.classList.remove(c); });
        });
        variant.classes.forEach(function (c) { root.classList.add(c); });
      }

      window.addEventListener('message', function (event) {
        var data = event.data;
        if (!data || data.source !== CHANNEL) return;

        /* What `active` means here: the set plays itself through, silently.
           There is no audio path from this message and there deliberately
           is not one — nothing on the rail has the gesture to arm it. */
        if (data.type === 'preview') {
          root.classList.toggle('struck-tones--live', data.active === true);
        }

        if (data.type === 'preview:variant') {
          var variant = VARIANTS[data.index];
          if (variant) apply(variant);
        }

        /* The pause reaches the CSS through the one global rule in the style
           block above, and the screen's shader through --run, handed in on
           the component's own element: the shader already takes its time
           from a CSS animation, so it holds with that animation, and --run is
           what stops its frame loop asking. */
        if (data.type === 'preview:pause') {
          if (data.paused === true) {
            document.documentElement.setAttribute('data-preview-paused', '');
            root.style.setProperty('--struck-tones-run', '0');
          } else {
            document.documentElement.removeAttribute('data-preview-paused');
            root.style.setProperty('--struck-tones-run', '1');
          }
        }

        /* How much this document's pixels are being shrunk on screen. The
           shader sizes its buffer for the pixels actually shown rather than
           the ones laid out, so a card drawing at 0.7 is not rendering half
           again as many as it can show. */
        if (data.type === 'preview:scale') {
          var n = Number(data.scale);
          if (isFinite(n) && n > 0) root.style.setProperty('--struck-tones-buffer-scale', String(n));
        }

        /* The ground is the rail's and follows the index into dark. The
           component is a dark plate between wooden cheeks and is not touched
           by it — which is what it already does on a light demo page. */
        if (data.type === 'preview:theme') {
          if (data.theme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.removeAttribute('data-theme');
          }
        }
      });

      /* Quick look runs this file with the pointer live, so focus ends up in
         here and the overlay's own Escape handler never sees the key. */
      if (window.parent !== window) {
        document.addEventListener('keydown', function (event) {
          if (event.key !== 'Escape') return;
          window.parent.postMessage({ source: CHANNEL, type: 'preview:key', key: 'Escape' }, '*');
        });

        window.parent.postMessage({
          source: CHANNEL,
          type: 'preview:ready',
          variants: VARIANTS.map(function (v) { return { id: v.id, label: v.label }; })
        }, '*');
      }
    })();
  </script>

</body>
</html>

<!doctype html>
<!--
  The thumbnail the landing page iframes: ONE instance of the component,
  centred on the demo's background, with no captions and no other states.

  Keep it minimal — it is rendered small. It links component.css and never
  redefines it, exactly like demo.html. If you change the component's markup,
  change it here too; this file and component.html should stay in step.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YYYY-MM-slug — preview</title>

  <!-- Same font loading as demo.html. -->
  <!-- <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=..."> -->

  <link rel="stylesheet" href="component.css">

  <style>
    /* Thumbnail scaffolding only. Nothing here may name a component class. */
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #ddd9d0;
      font-family: system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <!-- paste component.html markup here -->
  <article class="slug">
    <p class="slug__label">Label</p>
    <h2 class="slug__title">Title</h2>
    <p class="slug__body">Body copy that carries no branding from the reference.</p>
  </article>
</body>
</html>

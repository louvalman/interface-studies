<!doctype html>
<!--
  The thumbnail the landing page iframes: ONE instance of the component,
  centred on the demo's background, with no captions and no other states.

  Keep it minimal — it is rendered small. It links component.css and never
  redefines it, exactly like demo.html. If you change the component's markup,
  change it here too; this file and component.html should stay in step.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YYYY-MM-slug — preview</title>

  <!-- Same font loading as demo.html. -->
  <!-- <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=..."> -->

  <link rel="stylesheet" href="component.css">

  <!-- The ground, before the first paint. The index loads this frame with
     ?theme= on the src, so a thumbnail is never drawn on the wrong one and
     then corrected. Opened on its own, with no query, it keeps the light
     ground. -->
  <script>
    var theme = new URLSearchParams(location.search).get('theme');
    if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  </script>

  <style>
    /* Thumbnail scaffolding only. Nothing here may name a component class. */

    /* The shared ground, and the only colour this page writes. Both values are
       literals repeated in every folder rather than shared from anywhere — the
       folder has to survive being copied out — but they have to be the same
       two numbers in all of them, or the rail stops reading as one set of
       cards. That is what this ground is for: it is the rail's, not the
       component's, which is why it follows the index into dark rather than
       staying lit under it. Copy both lines as they are.

       And nothing on top of them. Whatever this study's demo.html stages the
       component on — a grid, a gradient, a lit stage — stays on the demo page.
       A card with a surface under it in a row of cards with none reads as a
       different kind of card before it reads as this study, which is what the
       shared ground exists to prevent.

       Both grounds are going to happen to this card, so check it on both
       before calling the study finished — every variant, at the rail's scale
       as well as at full size. A component standing on its own surface needs
       nothing: it sits as a lit plate on the dark ground, which is what it is.
       A component whose type sits on the GROUND inherits an ink colour that
       can only be right in one of the two, and the preview has to move it —
       by handing the component its own tunables in from outside, or by
       applying a dark modifier component.css declares. Never by writing a
       rule against a component class, and never off prefers-color-scheme:
       the rail can be dark under a light desktop, so [data-theme] is the
       only thing worth answering. */
    :root { --preview-ground: #f3f2ef; }
    :root[data-theme="dark"] { --preview-ground: #191b1e; }

    /* <html> carries it as well as <body>, so the background does not
       propagate to the viewport canvas and leave a seam at the frame edge. */
    html { background-color: var(--preview-ground); }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background-color: var(--preview-ground);
      font-family: system-ui, sans-serif;
    }
  
    /* The index has told this thumbnail that the rail is moving under a
       finger. Every animation in the document stops for the length of the
       gesture and picks up where it left off.

       It is here rather than in the component because it is the rail's
       problem, not the study's: a same-origin iframe shares the index's main
       thread, so a card that keeps animating while it is being dragged is
       animating against the drag, on the same thread the drag needs. Measured
       across the whole rail: 80 dropped frames in a two-card drag against 20
       with this in.

       Global on purpose. It has to reach the component without naming a
       single one of its classes — the same rule the rest of this file keeps.
       Transitions are deliberately left out: stopping those mid-gesture makes
       states snap instead of settle, and they are not what costs. */
    :root[data-preview-paused] *,
    :root[data-preview-paused] *::before,
    :root[data-preview-paused] *::after {
      animation-play-state: paused !important;
    }
  </style>
</head>
<body>
  <!-- paste component.html markup here -->
  <article class="slug">
    <p class="slug__label">Label</p>
    <h2 class="slug__title">Title</h2>
    <p class="slug__body">Body copy that carries no branding from the reference.</p>
  </article>

  <!--
    Optional, and thumbnail scaffolding only. Two jobs, both driven by the
    index, both inert when this file is opened on its own. Delete whichever
    the component has no use for.

      1. A card's iframe has pointer events off, so the component's :hover can
         never fire there. The index says when a card is being looked at; this
         file decides what that means — usually the modifier the component
         already has for its open state.
      2. Quick look steps through the variants listed here. The list lives in
         this file because the index must never name a component class: it is
         handed labels and draws dots.

    Note that toggling a variant element with the `hidden` attribute fails if
    component.css gives it a `display` — an author rule beats the UA one. Add
    and remove the node instead.
  -->
  <script>
    (function () {
      var CHANNEL = 'interface-studies';
      var root = document.querySelector('.slug');
      if (!root) return;

      // One entry per variant, first is the resting state the card shows.
      var VARIANTS = [
        { id: 'default', label: 'Default', classes: [] },
        { id: 'dark', label: 'Dark', classes: ['slug--dark'] }
      ];

      function apply(variant) {
        VARIANTS.forEach(function (v) {
          v.classes.forEach(function (c) { root.classList.remove(c); });
        });
        variant.classes.forEach(function (c) { root.classList.add(c); });
      }

      window.addEventListener('message', function (event) {
        var data = event.data;
        if (!data || data.source !== CHANNEL) return;

        if (data.type === 'preview') {
          root.classList.toggle('slug--open', data.active === true);
        }

        if (data.type === 'preview:variant') {
          var variant = VARIANTS[data.index];
          if (variant) apply(variant);
        }

        // Which theme the index is in. Keep this: the ground above is the
        // rail's rather than this study's, and every thumbnail moves with the
        // page together or the rail stops reading as one set of cards. What
        // the component sits on beyond the ground is the study's own, and is
        // not touched here.
        // The rail is moving under a finger, or stepping to a card, or this
        // card is off screen. Everything in here stops until it lands — see
        // the paused rule in the style block above. Resuming picks the
        // animations up where they were rather than restarting them, which is
        // the point of pausing over unloading.
        //
        // `data.reason` says which of the three it is — 'gesture', 'offscreen'
        // or 'drift' — and this handler deliberately ignores it, which is the
        // right default and what every study but two does. It is only worth
        // reading if the preview does work of its own on a timer: the drift is
        // the steady state with the card on screen, so a swap there is safe
        // where one under a finger is not. Animating through the drift is a
        // different question and the answer to it is no.
        if (data.type === 'preview:pause') {
          if (data.paused === true) {
            document.documentElement.setAttribute('data-preview-paused', '');
          } else {
            document.documentElement.removeAttribute('data-preview-paused');
          }
        }

        if (data.type === 'preview:theme') {
          if (data.theme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.removeAttribute('data-theme');
          }
        }
      });

      // Quick look runs this file with pointer events live, so the pointer —
      // and with it the focus — ends up inside this document. Keys pressed
      // here fire against *this* document and never reach the index, which is
      // where the overlay's Escape handler lives: click the component, press
      // Escape, and nothing happens. So the one key the overlay owns is handed
      // back across the channel. Only Escape. Anything else is the component's
      // to interpret — arrows move a caret in a field the component may have.
      if (window.parent !== window) {
        document.addEventListener('keydown', function (event) {
          if (event.key !== 'Escape') return;
          window.parent.postMessage({ source: CHANNEL, type: 'preview:key', key: 'Escape' }, '*');
        });
      }

      if (window.parent !== window) {
        window.parent.postMessage({
          source: CHANNEL,
          type: 'preview:ready',
          variants: VARIANTS.map(function (v) { return { id: v.id, label: v.label }; })
        }, '*');
      }
    })();
  </script>

</body>
</html>

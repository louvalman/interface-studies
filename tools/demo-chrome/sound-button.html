<!-- The page's Sound switch: what it does is this study's, said
     by window.demoPage.sound. Its word is its name and
     aria-pressed its state. Shown by the script once it has found
     Web Audio and something to reach. -->
<button class="demo__sound{{LOCAL}}" type="button" data-sound-toggle aria-pressed="false" hidden>
  <svg class="demo__sound-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" />
    <path class="demo__sound-waves" d="M15.5 9.2a4 4 0 0 1 0 5.6M18.2 6.6a7.6 7.6 0 0 1 0 10.8" />
    <path class="demo__sound-mute" d="M16 9.5l5 5M21 9.5l-5 5" />
  </svg>
  <span class="demo__sound-word" data-i18n="sound">Sound</span>
</button>

<!-- The theme, before the first paint. The toggle and the rest of it are in
     the chrome script at the foot of the page, but the answer has to be on
     <html> by the time the stylesheet draws, or a page opened in dark
     flashes a frame of the other one.

     The query string first, because that is how the index hands the choice
     over — over file:// each document gets an opaque origin and
     localStorage does not carry across. Then the stored choice, then the
     system's. Storage that throws is a missing choice, not a reason to skip
     the system. -->
<script>
  (function () {
    var t = new URLSearchParams(location.search).get('theme');
    if (t !== 'dark' && t !== 'light') {
      try { t = localStorage.getItem('interface-studies:theme'); } catch (err) { t = null; }
    }
    if (t !== 'dark' && t !== 'light') {
      t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>

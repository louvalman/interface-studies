<!doctype html>
<!--
  The thumbnail the landing page iframes: one card, no captions and no second
  copy. It links component.css and never redefines it — the width and the
  surface come in as the component's own re-theming channels, not as overrides
  of its internals.

  Two things here differ from demo.html on purpose, and both are about being
  read at thumbnail size.

  The ground: the shared one, in whichever theme the index is in — the #f3f2ef
  every study in this repo sits on, or the #191b1e they all take on a dark
  rail. It is the rail's ground rather than this study's: a card that broke
  ranks with it would read as a different kind of thing rather than as this
  study's card, whichever way round the page is. demo.html's ink is
  demo.html's, and it keeps it.

  The plotter grid does come along, because that is the component's context
  rather than the page's: in ink on the paper, in chalk on the dark ground.

  Which theme arrives over the message contract: `?theme=` on the src this is
  loaded with, and a `preview:theme` message if the index is switched while it
  is on screen.

  The surface: the demo leads with the porcelain default, this page leads with
  --acid and the waterfall. Not because porcelain fails at thumbnail size — at
  0.7 the grid still stops at the plate, the edge still holds, and the vortex
  still reads. It is that porcelain on the light ground inside the index's own
  light rail is three near-whites stacked, and a thumbnail has to be picked out
  of a row of them. Lime is the one surface that does that without going dark and
  reading as a hole, and the waterfall's 9 curves carry further than 13 nested
  squares at any size.

  The cost, stated: the card in the rail now advertises a modifier rather than
  the component's unmodified default, and it is the loudest card on the page.
  Porcelain is one quick-look dot behind it, which is where the demo opens.
-->
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2026-09-inked-plate-card — preview</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap">

  <link rel="stylesheet" href="component.css">

  <!-- The ground, before the first paint. The index loads this frame with
     ?theme= on the src, so the thumbnail is never drawn on the wrong one and
     then corrected — the card would flash paper for a frame on a dark page.
     Opened on its own, with no query, this page keeps the light ground. -->
  <script>
    var theme = new URLSearchParams(location.search).get('theme');
    if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  </script>

  <style>
    /* Thumbnail scaffolding only. Nothing here names a component class. */
    /* The same ground every study in this repo sits on. Repeated as a
       literal rather than shared, because the folder has to survive being
       copied out — but it has to be the same number in all of them, or the
       rail stops reading as one set of cards. <html> carries it too, so
       <body>'s background does not propagate to the viewport canvas and leave
       a seam at the frame edge.

       Both grounds are tokens, and both are the rail's rather than this
       study's: the dark one is the #191b1e every other thumbnail here takes,
       not demo.html's ink. The plotter grid is the part that belongs to the
       component, and it comes along — in ink on the paper, in chalk on the
       dark. The script at the foot of this file sets data-theme from what the
       index tells it. */
    :root {
      --preview-ground: #f3f2ef;
      --preview-grid: rgba(20, 24, 26, 0.05);
    }

    :root[data-theme="dark"] {
      --preview-ground: #191b1e;
      --preview-grid: rgba(232, 235, 228, 0.05);
    }

    html { background-color: var(--preview-ground); }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      /* An implicit auto column takes its max-content width and overflows
         quite happily, which leaves the card's own max-width: 100% resolving
         against 384px rather than against the frame. The track has to be
         allowed to shrink for the squeeze to reach the card. */
      grid-template-columns: minmax(0, 1fr);
      place-items: center;
      /* Enough top clearance that the card never runs under the index card's
         type and number badges, which sit over the top of this frame. */
      padding: 2.5rem 1rem 1.5rem;
      box-sizing: border-box;

      background-color: var(--preview-ground);
      /* The plotter grid the demo page uses — in ink on the light ground, in
         chalk on the dark one. It places the card on a drawing surface, and it
         is also what draws the edge of the porcelain plate when quick look
         steps to it: the grid runs up to the plate and stops. The lime plate
         this page rests on needs no such help. */
      background-image:
        linear-gradient(var(--preview-grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--preview-grid) 1px, transparent 1px);
      background-size: 44px 44px;

      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
    }

  </style>
</head>

  <!--
    Thumbnail scaffolding, and the one place a study folder may carry
    script. Two jobs, both driven by the index, both inert when this file is
    opened on its own:

      1. A card's iframe has pointer events off, so the component's :hover can
         never fire there. The index says when a card is being looked at, and
         --live is what the component already has for that state. It also
         means the index's scroll-into-read-position is what re-inks the
         drawing — the observer the CSS-only draw cannot have.
      2. Quick look steps through the three surfaces, each with its own
         drawing. The list lives here because the index must never name a
         component class: it is handed labels and draws dots.

    The resting state is the markup, not something this script applies, so the
    thumbnail is right with scripting off as well.
  -->
  <script>
    (function () {
      var CHANNEL = 'interface-studies';
      var BASE = 'inked-plate-card';
      var root = document.querySelector('.' + BASE);
      if (!root) return;

      var art = root.querySelector('.' + BASE + '__art');
      var title = root.querySelector('.' + BASE + '__title');
      var count = root.querySelector('.' + BASE + '__count');
      var note = root.querySelector('.' + BASE + '__note');

      // The resting drawing is the one in the markup; the other two come out
      // of the template, so all three live in this file exactly once.
      var pool = [root.querySelector('.' + BASE + '__ink').cloneNode(true)];
      var tpl = document.querySelector('[data-drawings]');
      if (tpl) {
        Array.prototype.forEach.call(tpl.content.querySelectorAll('svg'), function (s) {
          pool.push(s.cloneNode(true));
        });
      }

      // Lime leads, because it is the resting state in the markup above and
      // the first entry is what the card thumbnail shows. Drawing indices
      // follow the pool: 0 is the waterfall in the markup, 1 and 2 the vortex
      // and the envelope out of the template, in that order.
      var VARIANTS = [
        {
          id: 'acid', label: 'Lime', classes: ['--acid'], drawing: 0,
          title: 'Bølgelængder', count: '9 paths',
          note: 'Samdrift på tværs af teams.'
        },
        {
          id: 'porcelain', label: 'Porcelæn', classes: [], drawing: 1,
          title: 'Rammesætning', count: '13 paths',
          note: 'Rammer for sagen: omfang og frister.'
        },
        {
          id: 'graphite', label: 'Grafit', classes: ['--graphite'], drawing: 2,
          title: 'Netværk', count: '48 paths',
          note: 'Relationer mellem parter og sager.'
        },
        {
          id: 'ochre', label: 'Okker', classes: ['--ochre'], drawing: 1,
          title: 'Rammesætning', count: '13 paths',
          note: 'Rammer for sagen: omfang og frister.'
        },
        {
          id: 'indigo', label: 'Indigo', classes: ['--indigo'], drawing: 0,
          title: 'Bølgelængder', count: '9 paths',
          note: 'Samdrift på tværs af teams.'
        },
        {
          id: 'chalk', label: 'Kridt', classes: ['--chalk'], drawing: 2,
          title: 'Netværk', count: '48 paths',
          note: 'Relationer mellem parter og sager.'
        }
      ];

      function apply(variant) {
        VARIANTS.forEach(function (v) {
          v.classes.forEach(function (c) { root.classList.remove(BASE + c); });
        });
        variant.classes.forEach(function (c) { root.classList.add(BASE + c); });

        title.textContent = variant.title;
        count.textContent = variant.count;
        note.textContent = variant.note;

        var current = art.querySelector('.' + BASE + '__ink');
        var next = pool[variant.drawing].cloneNode(true);
        if (current) art.replaceChild(next, current);
        else art.appendChild(next);
      }

      window.addEventListener('message', function (event) {
        var data = event.data;
        if (!data || data.source !== CHANNEL) return;

        if (data.type === 'preview') {
          root.classList.toggle(BASE + '--live', data.active === true);
        }

        if (data.type === 'preview:variant') {
          var variant = VARIANTS[data.index];
          if (variant) apply(variant);
        }

        // The index was switched while this thumbnail was on screen. The
        // component is not touched — its plates are the study, and they are
        // the same six in both themes. Only the surface they are drawn on
        // moves, which is the one this folder authored either way.
        if (data.type === 'preview:theme') {
          if (data.theme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.removeAttribute('data-theme');
          }
        }
      });

      // Announces the listener is live, so a hover that landed before this
      // file parsed is re-sent rather than lost — and hands the index the
      // labels it needs for the quick-look dots.
      // Quick look runs this file with pointer events live, so the pointer —
      // and with it the focus — ends up inside this document. Keys pressed
      // here fire against *this* document and never reach the index, which is
      // where the overlay's Escape handler lives: click the component, press
      // Escape, and nothing happens. So the one key the overlay owns is handed
      // back across the channel. Only Escape. Anything else is the component's
      // to interpret — arrows move a caret in a field the component may have.
      if (window.parent !== window) {
        document.addEventListener('keydown', function (event) {
          if (event.key !== 'Escape') return;
          window.parent.postMessage({ source: CHANNEL, type: 'preview:key', key: 'Escape' }, '*');
        });
      }

      if (window.parent !== window) {
        window.parent.postMessage({
          source: CHANNEL,
          type: 'preview:ready',
          variants: VARIANTS.map(function (v) { return { id: v.id, label: v.label }; })
        }, '*');
      }
    })();
  </script>

</body>
</html>

<!doctype html>
<!--
  The thumbnail the landing page iframes: one card, no captions and no second
  copy. It links component.css and never redefines it — the width and the
  surface come in as the component's own re-theming channels, not as overrides
  of its internals.

  Three things here differ from demo.html on purpose, and all of them are
  about being read at thumbnail size.

  The ground: the shared one, in whichever theme the index is in — the #f3f2ef
  every study in this repo sits on, or the #191b1e they all take on a dark
  rail. It is the rail's ground rather than this study's: a card that broke
  ranks with it would read as a different kind of thing rather than as this
  study's card, whichever way round the page is. demo.html's ink is
  demo.html's, and it keeps it.

  The plotter grid does not come along, and that is the point of the ground
  being the rail's. demo.html stages this card on drawing paper because the
  study is about a plotter; the index stages five studies side by side, and a
  card with a surface under it while the other four have none reads as a
  different kind of card before it reads as this one. So the grid stays on the
  demo page, where it is that study's own staging, and the thumbnail sits on
  the same bare ground every other thumbnail here sits on.

  Which theme arrives over the message contract: `?theme=` on the src this is
  loaded with, and a `preview:theme` message if the index is switched while it
  is on screen.

  The surface: the demo leads with the porcelain default, this page leads with
  --acid and the waterfall. Porcelain on the light ground inside the index's
  own light rail is two near-whites stacked — #e8ebe4 on #f3f2ef, and with the
  grid gone there is nothing else drawing the plate's edge — so it is the one
  variant the bare ground costs something. Lime picks itself out of a row
  without going dark and reading as a hole, and the waterfall's 9 curves carry
  further than 13 nested squares at any size. Porcelain is one quick-look dot
  behind it, at full size, where the near-whites have room to separate.

  The cost, stated: the card in the rail now advertises a modifier rather than
  the component's unmodified default, and it is the loudest card on the page.
  The demo opens on porcelain, which is where the unmodified component is.

  The rotation: the card does not stand on lime, it steps through three of the
  six surfaces on a timer, one drawing each, and re-inks on every step. A
  thumbnail showing one plate says the component is that plate; the study is
  that the surface and the drawing are a pair, and six pairs cannot be argued
  from one. Which three is not a taste decision and is worked out at CYCLE
  below — two of the six have no edge on one of the two grounds, so the trio
  changes with the theme and the drawings do not.
-->
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2026-09-inked-plate-card — preview</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap">

  <link rel="stylesheet" href="component.css">

  <!-- The ground, before the first paint. The index loads this frame with
     ?theme= on the src, so the thumbnail is never drawn on the wrong one and
     then corrected — the card would flash paper for a frame on a dark page.
     Opened on its own, with no query, this page keeps the light ground. -->
  <script>
    var theme = new URLSearchParams(location.search).get('theme');
    if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  </script>

  <style>
    /* Thumbnail scaffolding only. Nothing here names a component class. */
    /* The same ground every study in this repo sits on. Repeated as a
       literal rather than shared, because the folder has to survive being
       copied out — but it has to be the same number in all of them, or the
       rail stops reading as one set of cards. <html> carries it too, so
       <body>'s background does not propagate to the viewport canvas and leave
       a seam at the frame edge.

       Both grounds are tokens, and both are the rail's rather than this
       study's: the dark one is the #191b1e every other thumbnail here takes,
       not demo.html's ink. Nothing is painted on top of either — the plotter
       grid is demo.html's staging and it stays there, because a card with a
       surface under it in a row of cards with none reads as a different kind
       of card first and as this study second. The script at the foot of this
       file sets data-theme from what the index tells it. */
    :root { --preview-ground: #f3f2ef; }
    :root[data-theme="dark"] { --preview-ground: #191b1e; }

    html { background-color: var(--preview-ground); }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      /* An implicit auto column takes its max-content width and overflows
         quite happily, which leaves the card's own max-width: 100% resolving
         against 384px rather than against the frame. The track has to be
         allowed to shrink for the squeeze to reach the card. */
      grid-template-columns: minmax(0, 1fr);
      place-items: center;
      /* Enough top clearance that the card never runs under the index card's
         type and number badges, which sit over the top of this frame. */
      padding: 2.5rem 1rem 1.5rem;
      box-sizing: border-box;

      background-color: var(--preview-ground);
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
    }

  
    /* The index has told this thumbnail that the rail is moving under a
       finger. Every animation in the document stops for the length of the
       gesture and picks up where it left off.

       It is here rather than in the component because it is the rail's
       problem, not the study's: a same-origin iframe shares the index's main
       thread, so a card that keeps animating while it is being dragged is
       animating against the drag, on the same thread the drag needs. Measured
       across the whole rail: 80 dropped frames in a two-card drag against 20
       with this in.

       Global on purpose. It has to reach the component without naming a
       single one of its classes — the same rule the rest of this file keeps.
       Transitions are deliberately left out: stopping those mid-gesture makes
       states snap instead of settle, and they are not what costs. */
    :root[data-preview-paused] *,
    :root[data-preview-paused] *::before,
    :root[data-preview-paused] *::after {
      animation-play-state: paused !important;
    }
  </style>
</head>

          <path class="inked-plate-card__line" pathLength="1" style="--i:46"
                d="M 78.8 20.8 L 42 42" />
          <path class="inked-plate-card__line" pathLength="1" style="--i:47"
                d="M 89.3 18.7 L 68.6 24.2" />
        </svg>
  </template>

  <!--
    Thumbnail scaffolding, and the one place a study folder may carry
    script. Three jobs, all driven by the index, all inert when this file is
    opened on its own:

      1. A card's iframe has pointer events off, so the component's :hover can
         never fire there. The index says when a card is being looked at, and
         --live is what the component already has for that state. It also
         means the index's scroll-into-read-position is what re-inks the
         drawing — the observer the CSS-only draw cannot have.
      2. Quick look steps through the six surfaces, each with its own
         drawing. The list lives here because the index must never name a
         component class: it is handed labels and draws dots.
      3. On the rail the card steps through three of them on a timer of its
         own, re-inking on every step. See the rotation in the script.

    The resting state is the markup, not something this script applies, so the
    thumbnail is right with scripting off as well.
  -->
  <script>
    (function () {
      var CHANNEL = 'interface-studies';
      var BASE = 'inked-plate-card';
      var root = document.querySelector('.' + BASE);
      if (!root) return;

      var art = root.querySelector('.' + BASE + '__art');
      var title = root.querySelector('.' + BASE + '__title');
      var count = root.querySelector('.' + BASE + '__count');
      var note = root.querySelector('.' + BASE + '__note');

      // The resting drawing is the one in the markup; the other two come out
      // of the template, so all three live in this file exactly once.
      var pool = [root.querySelector('.' + BASE + '__ink').cloneNode(true)];
      var tpl = document.querySelector('[data-drawings]');
      if (tpl) {
        Array.prototype.forEach.call(tpl.content.querySelectorAll('svg'), function (s) {
          pool.push(s.cloneNode(true));
        });
      }

      // Lime leads, because it is the resting state in the markup above and
      // the first entry is what the card thumbnail shows. Drawing indices
      // follow the pool: 0 is the waterfall in the markup, 1 and 2 the vortex
      // and the envelope out of the template, in that order.
      var VARIANTS = [
        {
          id: 'acid', label: 'Lime', classes: ['--acid'], drawing: 0,
          title: 'Bølgelængder', count: '9 paths',
          note: 'Samdrift på tværs af teams.'
        },
        {
          id: 'porcelain', label: 'Porcelæn', classes: [], drawing: 1,
          title: 'Rammesætning', count: '13 paths',
          note: 'Rammer for sagen: omfang og frister.'
        },
        {
          id: 'graphite', label: 'Grafit', classes: ['--graphite'], drawing: 2,
          title: 'Netværk', count: '48 paths',
          note: 'Relationer mellem parter og sager.'
        },
        {
          id: 'ochre', label: 'Okker', classes: ['--ochre'], drawing: 1,
          title: 'Rammesætning', count: '13 paths',
          note: 'Rammer for sagen: omfang og frister.'
        },
        {
          id: 'indigo', label: 'Indigo', classes: ['--indigo'], drawing: 0,
          title: 'Bølgelængder', count: '9 paths',
          note: 'Samdrift på tværs af teams.'
        },
        {
          id: 'chalk', label: 'Kridt', classes: ['--chalk'], drawing: 2,
          title: 'Netværk', count: '48 paths',
          note: 'Relationer mellem parter og sager.'
        }
      ];

      function apply(variant) {
        VARIANTS.forEach(function (v) {
          v.classes.forEach(function (c) { root.classList.remove(BASE + c); });
        });
        variant.classes.forEach(function (c) { root.classList.add(BASE + c); });

        title.textContent = variant.title;
        count.textContent = variant.count;
        note.textContent = variant.note;

        var current = art.querySelector('.' + BASE + '__ink');
        var next = pool[variant.drawing].cloneNode(true);
        if (current) art.replaceChild(next, current);
        else art.appendChild(next);
      }

      function byId(id) {
        return VARIANTS.filter(function (v) { return v.id === id; })[0];
      }

      // --- the rail rotation ---------------------------------------------
      //
      // Three surfaces, one drawing each, stepped on a timer so the card in
      // the rail shows what the six plates are rather than standing on one of
      // them. Replacing the ink node is what re-inks it, so each step is the
      // drawing being made again — the same gesture the pointer gets, arriving
      // on its own.
      //
      // Which three depends on the ground, and that is not a preference: two
      // of the six have no edge on one of the two. Porcelain is 2.62 OK dE
      // from the light ground and graphite 1.95 from the dark one, which is to
      // say the same colour as the paper they would be sitting on, with
      // nothing else drawing the plate's edge now that the plotter grid stays
      // on the demo page. Acid and ochre clear both grounds comfortably —
      // 19.74 and 18.92 on paper, 70.11 and 60.77 on ink — so they lead either
      // way, and the third seat is graphite on paper and chalk on ink. Both of
      // those carry the envelope, so the cycle is the same three drawings
      // whichever way the page is: waterfall, vortex, envelope.
      var CYCLE = {
        light: ['acid', 'ochre', 'graphite'],
        dark: ['acid', 'ochre', 'chalk']
      };

      // In the 6-8s band the rail was asked for, and deliberately not the same
      // number the detail reveal card uses: two cards stepping on one period
      // restyle on one frame, every time, which is the argument the demo
      // wave's stagger already makes about the rail.
      var CYCLE_MS = 6500;

      var reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
      var cycleTimer = 0;
      var cyclePos = 0;
      var held = false;    // the rail is moving, or this card is off screen
      var taken = false;   // a reader, or quick look, has asked for a variant

      function isDark() {
        return document.documentElement.getAttribute('data-theme') === 'dark';
      }

      // The trio leads the reported list and the other three follow, so quick
      // look's dots open on the card the rail was showing and carry on in the
      // order it was going — the same shape the detail reveal card's
      // ordered() has. Acid leads both trios, which is what keeps the resting
      // state the markup's rather than something this script applies: the
      // thumbnail is right with scripting off too.
      function ordered(dark) {
        var lead = CYCLE[dark ? 'dark' : 'light'].map(byId);
        return lead.concat(VARIANTS.filter(function (v) { return lead.indexOf(v) < 0; }));
      }

      var list = ordered(isDark());

      function cycleLen() {
        return CYCLE[isDark() ? 'dark' : 'light'].length;
      }

      // Two things end it outright. A reader who has asked for a variant
      // outranks it, and for good — this file is what quick look loads too,
      // and rotating under its dots would take the card they picked away from
      // them. And reduced motion, which is the whole of what this is: content
      // that changes on its own, unasked. Being held is neither, and the
      // block below is about the difference.
      // --- what holds a step, and what only defers it --------------------
      //
      // The rail pauses a card whenever it is off screen or the rail is
      // moving, and on a drifting rail that is most of a card's life:
      // measured on the live index over 70 seconds, this card was on screen
      // for 56 of them and unpaused for 31. A timer cleared on every pause
      // therefore counts unpaused time, and the card steps about once every
      // 23 seconds instead of every 6 to 8 — measured, three steps in that
      // 70 rather than ten.
      //
      // So the clock runs through the hold and only the swap waits. A step
      // that comes due while the card is held is taken when it is let go,
      // which on this rail is the moment the card arrives at the read mark —
      // one swap, not the several the hold was worth. Nothing restyles off
      // screen or under a finger, which is what the pause is for, and the
      // cadence is wall clock, which is what was asked for.
      //
      // SETTLE_MS is the gap before that deferred swap. Without it a card
      // swaps on the frame it arrives on, which is the frame the rail is
      // already handing off on — and a preview that came due while it was
      // still loading would change before its resting state had been seen at
      // all.
      var SETTLE_MS = 1200;

      var due = false;

      function heldNow() {
        return held || document.hidden;
      }

      function cycleStop() {
        clearTimeout(cycleTimer);
        cycleTimer = 0;
      }

      function cycleSoon(ms) {
        cycleStop();
        if (taken || reduced.matches) return;
        cycleTimer = setTimeout(function () {
          cycleTimer = 0;
          if (taken || reduced.matches) return;
          if (heldNow()) { due = true; return; }
          due = false;
          cyclePos = (cyclePos + 1) % cycleLen();
          apply(list[cyclePos]);
          cycleSoon(CYCLE_MS);
        }, ms);
      }

      // Let go of: the rail landed, the card came back on screen, or the tab
      // did. A step already due is taken a beat later; otherwise the clock
      // simply carries on.
      function cycleRelease() {
        cycleSoon(due ? SETTLE_MS : CYCLE_MS);
      }

      window.addEventListener('message', function (event) {
        var data = event.data;
        if (!data || data.source !== CHANNEL) return;

        if (data.type === 'preview') {
          root.classList.toggle(BASE + '--live', data.active === true);
        }

        // A reader has picked a card, or quick look's own autoplay has. Either
        // way the rotation is over for this document — it is not the index's
        // to fight, and this is the same file quick look loads. In practice
        // the overlay gets there first anyway: its autoplay steps at 4000ms
        // and nothing here moves before 6500.
        if (data.type === 'preview:variant') {
          taken = true;
          cycleStop();
          var variant = list[data.index];
          if (variant) apply(variant);
        }

        // The index was switched while this thumbnail was on screen. The
        // component is not touched — its plates are the study, and they are
        // the same six in both themes. Only the surface they are drawn on
        // moves, which is the one this folder authored either way.
        // The rail is moving under a finger, or stepping to a card. Everything
        // in here stops until it lands — see the paused rule in the style
        // block above. Resuming picks the animations up where they were
        // rather than restarting them, which is the point of pausing over
        // unloading.
        if (data.type === 'preview:pause') {
          held = data.paused === true;
          if (held) {
            document.documentElement.setAttribute('data-preview-paused', '');
          } else {
            document.documentElement.removeAttribute('data-preview-paused');
          }
          // The paused rule above is CSS and reaches animations only; a timer
          // is not an animation, so the rotation has to be held by hand.
          if (!held) cycleRelease();
        }

        if (data.type === 'preview:theme') {
          if (data.theme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.removeAttribute('data-theme');
          }
          // The third seat in the rotation swaps with the ground — graphite on
          // paper, chalk on ink — so a card standing on it when the page is
          // switched is standing on the one plate that has no edge there. Put
          // it on the new trio's member at the same position, which leaves the
          // first two untouched because they are the same two either way.
          // Rebuilt, so the trio leading it is the one with an edge on the
          // ground the page is now. Quick look loads its own frame with
          // ?theme= on the src and is never switched underneath, so no dot it
          // has drawn is left pointing at a different card by this.
          list = ordered(isDark());
          if (!taken) {
            apply(list[cyclePos % cycleLen()]);
            due = false;
            cycleSoon(CYCLE_MS);
          }
        }
      });

      // Announces the listener is live, so a hover that landed before this
      // file parsed is re-sent rather than lost — and hands the index the
      // labels it needs for the quick-look dots.
      // Quick look runs this file with pointer events live, so the pointer —
      // and with it the focus — ends up inside this document. Keys pressed
      // here fire against *this* document and never reach the index, which is
      // where the overlay's Escape handler lives: click the component, press
      // Escape, and nothing happens. So the one key the overlay owns is handed
      // back across the channel. Only Escape. Anything else is the component's
      // to interpret — arrows move a caret in a field the component may have.
      if (window.parent !== window) {
        document.addEventListener('keydown', function (event) {
          if (event.key !== 'Escape') return;
          window.parent.postMessage({ source: CHANNEL, type: 'preview:key', key: 'Escape' }, '*');
        });
      }

      if (window.parent !== window) {
        window.parent.postMessage({
          source: CHANNEL,
          type: 'preview:ready',
          variants: list.map(function (v) { return { id: v.id, label: v.label }; })
        }, '*');
      }

      // Framed only, so a file opened on its own still shows exactly what its
      // markup says — the same claim the rest of this script makes.
      if (window.parent !== window) {
        document.addEventListener('visibilitychange', function () {
          if (!document.hidden) cycleRelease();
        });
        if (reduced.addEventListener) {
          reduced.addEventListener('change', function () {
            if (reduced.matches) cycleStop();
            else cycleSoon(CYCLE_MS);
          });
        }
        cycleSoon(CYCLE_MS);
      }
    })();
  </script>

</body>
</html>

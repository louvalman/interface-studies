<!doctype html>
<!--
  The thumbnail the landing page iframes: one instance, centred on the same
  ground demo.html uses, with no captions and no other states.

  It shows --step in use rather than the whole twelve-tile set the demo shows.
  Two reasons. At thumbnail size twelve surfaces read as a colour picker
  instead of as a piece, and every other card in the rail shows one object.
  And the set is laid out along the colour axis, which meant the card led with
  the warmest, lightest themes in the folder.

  The one composition is two --step blocks whose rags walk out from the middle,
  so the widest bands meet there and the narrowest sit at the outer ends. The
  upper block carries --rise, which turns its settle around: the colour gathers
  where the two blocks meet and dissolves outward into the page at both narrow
  ends, rather than both blocks starting hot at their own top edge and reading
  as two objects. The card is a field with the type cut out of it, fading away
  from itself in both directions.

  What moves when the card is looked at is the recipe. At rest the drawing is
  showing; looked at, it dissolves off and leaves the stop list underneath.
  See the script at the end of the file.

  It links component.css and never redefines it. The one thing set from here is
  scale, through the component's own tunables and inline on the root, because
  the tunable block lives on .drawn-gradients itself and an inherited value
  from `body` would lose to it.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2026-09-drawn-gradients &mdash; preview</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap">

  <link rel="stylesheet" href="component.css">

  <style>
    /* Thumbnail scaffolding only. Nothing here names a component class. */
    /* The same #f3f2ef every reference in this repo sits on. <html> carries it
       too, so <body>'s background does not propagate to the viewport canvas
       and leave a seam at the frame edge. It is a constant now rather than
       something the variant switches: the rail only reads as one set of cards
       if the ground behind them never moves, so the darkness belongs to the
       surface and not to the page. */
    html { background-color: #f3f2ef; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      box-sizing: border-box;
      background-color: #f3f2ef;
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <!-- A definite width, not just a max-width. --step's usage block declares
       itself a container so it can size its type off its own width, and size
       containment means it no longer reports its content's width upward — in
       a shrink-to-fit parent, which this centred body is, the shape collapses
       to nothing. The demo's wide states set `width` for the same reason. -->
  <section class="drawn-gradients"
           style="width: 26rem;
                  max-width: 100%;
                  --drawn-gradients-size: 8.4rem;
                  --drawn-gradients-row-gap: 1.75rem;
                  --drawn-gradients-width: 26rem;
                  --drawn-gradients-blur-ratio: 0.24;">
      <div class="drawn-gradients__usage drawn-gradients__usage--down">
        <div class="drawn-gradients__usage-row">
          <span class="drawn-gradients__usage-line drawn-gradients__usage-line--label">Overlapping art</span>
          <span class="drawn-gradients__surface drawn-gradients__surface--step drawn-gradients__surface--mix drawn-gradients__surface--ice drawn-gradients__surface--rise"
                style="--drawn-gradients-step-row: 0;">
          <svg class="drawn-gradients__draw" viewBox="0 0 120 120"
               preserveAspectRatio="xMidYMid slice" aria-hidden="true">
            <ellipse class="drawn-gradients__blob drawn-gradients__blob--hot"
                     cx="26" cy="20" rx="82" ry="54" transform="rotate(-18 26 20)" />
            <ellipse class="drawn-gradients__blob drawn-gradients__blob--cool"
                     cx="104" cy="48" rx="70" ry="48" transform="rotate(24 104 48)" />
            <ellipse class="drawn-gradients__blob drawn-gradients__blob--warm"
                     cx="54" cy="104" rx="88" ry="52" transform="rotate(-8 54 104)" />
          </svg>
          </span>
        </div>
        <span class="drawn-gradients__usage-line drawn-gradients__usage-line--value">34%</span>

        <div class="drawn-gradients__usage-row">
          <span class="drawn-gradients__usage-line drawn-gradients__usage-line--label">Flat colour</span>
          <span class="drawn-gradients__surface drawn-gradients__surface--step drawn-gradients__surface--mix drawn-gradients__surface--ice drawn-gradients__surface--rise"
                style="--drawn-gradients-step-row: 1;">
          <svg class="drawn-gradients__draw" viewBox="0 0 120 120"
               preserveAspectRatio="xMidYMid slice" aria-hidden="true">
            <ellipse class="drawn-gradients__blob drawn-gradients__blob--hot"
                     cx="26" cy="20" rx="82" ry="54" transform="rotate(-18 26 20)" />
            <ellipse class="drawn-gradients__blob drawn-gradients__blob--cool"
                     cx="104" cy="48" rx="70" ry="48" transform="rotate(24 104 48)" />
            <ellipse class="drawn-gradients__blob drawn-gradients__blob--warm"
                     cx="54" cy="104" rx="88" ry="52" transform="rotate(-8 54 104)" />
          </svg>
          </span>
        </div>
        <span class="drawn-gradients__usage-line drawn-gradients__usage-line--value">61%</span>

        <div class="drawn-gradients__usage-row">
          <span class="drawn-gradients__usage-line drawn-gradients__usage-line--label">Wash</span>
          <span class="drawn-gradients__surface drawn-gradients__surface--step drawn-gradients__surface--mix drawn-gradients__surface--ice drawn-gradients__surface--rise"
                style="--drawn-gradients-step-row: 2;">
          <svg class="drawn-gradients__draw" viewBox="0 0 120 120"
               preserveAspectRatio="xMidYMid slice" aria-hidden="true">
            <ellipse class="drawn-gradients__blob drawn-gradients__blob--hot"
                     cx="26" cy="20" rx="82" ry="54" transform="rotate(-18 26 20)" />
            <ellipse class="drawn-gradients__blob drawn-gradients__blob--cool"
                     cx="104" cy="48" rx="70" ry="48" transform="rotate(24 104 48)" />
            <ellipse class="drawn-gradients__blob drawn-gradients__blob--warm"
                     cx="54" cy="104" rx="88" ry="52" transform="rotate(-8 54 104)" />
          </svg>
          </span>
        </div>
        <span class="drawn-gradients__usage-line drawn-gradients__usage-line--value">82%</span>
      </div>

      <div class="drawn-gradients__usage drawn-gradients__usage--up">
        <div class="drawn-gradients__usage-row">
          <span class="drawn-gradients__usage-line drawn-gradients__usage-line--label">Wash</span>
          <span class="drawn-gradients__surface drawn-gradients__surface--step drawn-gradients__surface--mix drawn-gradients__surface--arc"
                style="--drawn-gradients-step-row: 0;">
          <svg class="drawn-gradients__draw" viewBox="0 0 120 120"
               preserveAspectRatio="xMidYMid slice" aria-hidden="true">
            <ellipse class="drawn-gradients__blob drawn-gradients__blob--hot"
                     cx="26" cy="20" rx="82" ry="54" transform="rotate(-18 26 20)" />
            <ellipse class="drawn-gradients__blob drawn-gradients__blob--cool"
                     cx="104" cy="48" rx="70" ry="48" transform="rotate(24 104 48)" />
            <ellipse class="drawn-gradients__blob drawn-gradients__blob--warm"
                     cx="54" cy="104" rx="88" ry="52" transform="rotate(-8 54 104)" />
          </svg>
          </span>
        </div>
        <span class="drawn-gradients__usage-line drawn-gradients__usage-line--value">82%</span>

        <div class="drawn-gradients__usage-row">
          <span class="drawn-gradients__usage-line drawn-gradients__usage-line--label">Flat colour</span>
          <span class="drawn-gradients__surface drawn-gradients__surface--step drawn-gradients__surface--mix drawn-gradients__surface--arc"
                style="--drawn-gradients-step-row: 1;">
          <svg class="drawn-gradients__draw" viewBox="0 0 120 120"
               preserveAspectRatio="xMidYMid slice" aria-hidden="true">
            <ellipse class="drawn-gradients__blob drawn-gradients__blob--hot"
                     cx="26" cy="20" rx="82" ry="54" transform="rotate(-18 26 20)" />
            <ellipse class="drawn-gradients__blob drawn-gradients__blob--cool"
                     cx="104" cy="48" rx="70" ry="48" transform="rotate(24 104 48)" />
            <ellipse class="drawn-gradients__blob drawn-gradients__blob--warm"
                     cx="54" cy="104" rx="88" ry="52" transform="rotate(-8 54 104)" />
          </svg>
          </span>
        </div>
        <span class="drawn-gradients__usage-line drawn-gradients__usage-line--value">61%</span>

        <div class="drawn-gradients__usage-row">
          <span class="drawn-gradients__usage-line drawn-gradients__usage-line--label">Overlapping art</span>
          <span class="drawn-gradients__surface drawn-gradients__surface--step drawn-gradients__surface--mix drawn-gradients__surface--arc"
                style="--drawn-gradients-step-row: 2;">
          <svg class="drawn-gradients__draw" viewBox="0 0 120 120"
               preserveAspectRatio="xMidYMid slice" aria-hidden="true">
            <ellipse class="drawn-gradients__blob drawn-gradients__blob--hot"
                     cx="26" cy="20" rx="82" ry="54" transform="rotate(-18 26 20)" />
            <ellipse class="drawn-gradients__blob drawn-gradients__blob--cool"
                     cx="104" cy="48" rx="70" ry="48" transform="rotate(24 104 48)" />
            <ellipse class="drawn-gradients__blob drawn-gradients__blob--warm"
                     cx="54" cy="104" rx="88" ry="52" transform="rotate(-8 54 104)" />
          </svg>
          </span>
        </div>
        <span class="drawn-gradients__usage-line drawn-gradients__usage-line--value">34%</span>
      </div>
  </section>

  <!--
    Thumbnail scaffolding only, driven by the index and inert when this file is
    opened on its own. Quick look steps the theme axis while the shape and the
    type block stay put — the list lives here because the index must never name
    a component class; it is handed labels and draws dots.

    The surface base is set from here rather than from component.css: the
    recipe settles to the surface colour it sits on, and only this page knows
    what colour that is. `active` is a bigger move than a colour, though: the
    card changes RECIPE. At rest the nebula drawing is showing — three blurred
    ellipses per band, colour carried right to the silhouette's edges. Looked
    at, the drawing dissolves off and leaves the stop list underneath: the same
    shape and the same hues, made the other way, gathering where the two blocks
    meet and washing out into the page at both narrow ends. That is the
    folder's whole thesis, and the card is the one place it can be a change
    rather than two states side by side.

    Colour at rest, wash on hover, and not the other way round. The drawn
    surface is the one that holds at thumbnail size: it fills its silhouette,
    so the card reads as an object in a rail of objects. The stop recipe's ends
    dissolve into the page, which is the better picture but only once you are
    looking at it — so it is what looking at it gets you.

    It cross-fades because the two are ON one surface rather than swapping:
    --mix puts the drawing over the stop list instead of in place of it, and
    --drawn-gradients-mix is its opacity. An earlier version toggled --drawn
    and cut, because --drawn sets background-image: none and there was nothing
    underneath to fade into. --…-mix-ease is the curve: 520ms rather than the
    280 --ease spends on a colour, because this moves the whole surface from
    one construction to the other.

    Colours were tried first and all of them were smaller. A base off the page
    — sand, a paper tint — read as the card being slightly warmer rather than
    as an event. Lime was the best of them, and the sweep behind it is worth
    keeping: the base is what BOTH blocks ramp into, so a base near either hot
    end's complement greys out through the middle. Amber is lovely under the
    magenta and turns the blue block to khaki; a cool slate completes the blue
    and fights the magenta; lilac avoids both by sitting between the two hues
    and is dull for the same reason. The base stays on the page's ground now:
    it is what the stopped end of the mix washes out to.

    A theme swap was the other candidate and is the one thing this must not
    do. The hues are the variant axis, and quick look sets them from the dots;
    hover setting the same three properties would mean a picked variant
    vanished for as long as the pointer was inside the frame, which in quick
    look is most of the time. A theme PER BAND was tried too, for a card that
    changes to many colours at once, and it breaks the piece: --step exists to
    slice one field across the bands, so giving each its own hues makes each
    band paint its own field, the slices stop lining up, and the joins show. The base still eases, it just has
    nowhere to go now.

    The settle *direction* was the other candidate — swapping --rise onto the
    lower block so the pair fades inward. Built and dropped: the widest bands
    carry most of the field's area and they are the ones that wash out, so the
    staircase stops reading at exactly the moment the card is being looked at.

    Two routes into the same state, and neither is the component's own :hover.
    A card thumbnail has pointer events off, so the index sends the message;
    quick look runs this file with pointer events on, where the listeners
    below fire instead and the message never arrives. The state is one
    function either way. It is not a CSS :hover rule because the base swap is
    a thumbnail's editorial decision about its own resting state, not
    something a gradient field does when a pointer is over it.
  -->
  <script>
    (function () {
      var CHANNEL = 'ui-reference-base';
      var BASE = 'drawn-gradients__surface--';
      /* What the field settles to. Set as the component's own tunable, from
         outside, which is what that block is for: the recipe settles to the
         surface colour it sits on and only this page knows its own. */
      var GROUND = '#f3f2ef';
      var surfaces = Array.prototype.slice.call(
        document.querySelectorAll('.drawn-gradients__surface')
      );
      if (!surfaces.length) return;

      var COLOURS = ['dawn', 'dusk', 'mint', 'ice', 'arc'];

      // Colour is authored per block too: ice above, arc below. Captured here,
      // before anything is applied, so the resting variant can put it back —
      // a variant that set one colour on every surface would flatten the pair
      // into one hue and the card would lose half of what it is showing.
      var authored = surfaces.map(function (el) {
        return COLOURS.filter(function (c) {
          return el.classList.contains(BASE + c);
        });
      });

      // First entry is the resting state, and it is what the card shows. The
      // colour axis only: the base is not on this list, because it is what
      // being looked at means rather than a state to pick.
      var VARIANTS = [
        { id: 'authored', label: 'Ice over arc', theme: null },
        { id: 'arc', label: 'Arc', theme: 'arc' },
        { id: 'ice', label: 'Ice', theme: 'ice' },
        { id: 'dusk', label: 'Dusk', theme: 'dusk' },
        { id: 'mint', label: 'Mint', theme: 'mint' },
        { id: 'dawn', label: 'Dawn', theme: 'dawn' }
      ];

      // Two inputs, one render, because the two arrive independently: quick
      // look can step a variant while the pointer is already inside it, and
      // applying either one on its own would drop the other.
      var variant = VARIANTS[0];
      var active = false;
      var root = document.querySelector('.drawn-gradients');

      function render() {
        surfaces.forEach(function (el, i) {
          COLOURS.forEach(function (c) { el.classList.remove(BASE + c); });

          (variant.theme ? [variant.theme] : authored[i])
            .forEach(function (c) { el.classList.add(BASE + c); });

          // The fill settles into this page rather than to white — that is
          // the recipe's third decision, and only this page knows its own
          // colour. It holds in both states; under the drawing it barely
          // shows, since the blobs run past the frame.
          el.style.setProperty('--drawn-gradients-base', GROUND);

          // The recipe itself is what being looked at changes, and the whole
          // move is this one number: 1 is the drawing, 0 is the stop list,
          // and component.css eases between them.
          el.style.setProperty('--drawn-gradients-mix', active ? '0' : '1');
        });
      }

      function setActive(next) {
        next = !!next;
        if (next === active) return;
        active = next;
        render();
      }

      window.addEventListener('message', function (event) {
        var data = event.data;
        if (!data || data.source !== CHANNEL) return;

        if (data.type === 'preview') {
          setActive(data.active);
        }

        if (data.type === 'preview:variant') {
          var next = VARIANTS[data.index];
          if (next) { variant = next; render(); }
        }

        if (data.type === 'preview:scale') {
          setScale(data.scale);
        }
      });

      // The mask's antialiasing ramp is authored as one DEVICE pixel, and
      // component.css picks it with resolution media queries — which can only
      // see this frame's own ratio. A card lays the preview out at
      // --preview-w and shows it at --preview-scale, so the ramp is rasterised
      // at a fraction of the pixel it asked for: at 0.55 it lands at half a
      // device pixel, gets point-sampled, and every curve in the thumbnail
      // stair-steps. The index reports the factor; the ramp is restated
      // against it here, inline, so it beats the media queries.
      //
      // A tunable set from outside, which is the whole point of the custom
      // property block — this file still never writes a rule against a
      // component class. Standalone, no message arrives and the media queries
      // stand as authored.
      function setScale(scale) {
        if (!(scale > 0) || !root) return;
        var dpr = window.devicePixelRatio || 1;
        root.style.setProperty(
          '--drawn-gradients-step-feather',
          (1 / (dpr * scale)).toFixed(4) + 'px'
        );
      }

      // The quick-look route. Inert in a card, whose iframe has pointer events
      // off, and inert on a coarse pointer, where the index sends the message
      // for the card in the read position instead — so a touch device reaches
      // the same state without a pointer, which is the whole reason the
      // contract exists.
      if (root) {
        root.addEventListener('pointerenter', function () { setActive(true); });
        root.addEventListener('pointerleave', function () { setActive(false); });
      }

      render();

      if (window.parent !== window) {
        window.parent.postMessage({
          source: CHANNEL,
          type: 'preview:ready',
          variants: VARIANTS.map(function (v) { return { id: v.id, label: v.label }; })
        }, '*');
      }
    })();
  </script>

</body>
</html>

<!doctype html>
<!--
  The thumbnail the landing page iframes: one instance, centred on the same
  ground demo.html uses, with no captions and no other states.

  It shows --step in use rather than the whole twelve-tile set the demo shows.
  Two reasons. At thumbnail size twelve surfaces read as a colour picker
  instead of as a piece, and every other card in the rail shows one object.
  And the set is laid out along the colour axis, which meant the card led with
  the warmest, lightest themes in the folder.

  The one composition is two --step blocks whose rags walk out from the middle,
  so the widest bands meet there and the narrowest sit at the outer ends. The
  upper block carries --rise, which turns its settle around: the colour gathers
  where the two blocks meet and dissolves outward into the page at both narrow
  ends, rather than both blocks starting hot at their own top edge and reading
  as two objects. The card is a field with the type cut out of it, fading away
  from itself in both directions.

  What moves when the card is looked at is the recipe. At rest the drawing is
  showing; looked at, it dissolves off and leaves the stop list underneath.
  See the script at the end of the file.

  That is the card. Quick look is a different room, and it gets the rest of the
  folder: the composition above is the first of six, and the other five are
  <template>s below — the set as component.html builds it, the shapes, the five
  themes, the night base, and the step run the other way. One is mounted at a
  time, in the stage the card's composition already sits in.

  It links component.css and never redefines it. The two things set from here
  are scale and the base the field settles to, both through the component's own
  tunables and inline on each composition's root, because the tunable block
  lives on .drawn-gradients itself and an inherited value from `body` would
  lose to it.
-->

<head>
  <meta charset="utf-8">

  <title>2026-09-drawn-gradients &mdash; preview</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap">

  <link rel="stylesheet" href="component.css">

  <style>
    /* Thumbnail scaffolding only. Nothing here names a component class. */
    /* The same #f3f2ef every study in this repo sits on. <html> carries it
       too, so <body>'s background does not propagate to the viewport canvas
       and leave a seam at the frame edge. It is a constant now rather than
       something the variant switches: the rail only reads as one set of cards
       if the ground behind them never moves, so the darkness belongs to the
       surface and not to the page. */
    html { background-color: #f3f2ef; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      /* An implicit auto column takes its max-content width and overflows
         quite happily, and a composition here is as wide as 26rem — so the
         track is told it may shrink, and the stage inside it too. */
      grid-template-columns: minmax(0, 1fr);
      place-items: center;
      padding: 1.5rem;
      box-sizing: border-box;
      background-color: #f3f2ef;
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
    }

    /* The mount point, and the only element on this page that is not the
       component: quick look asks for a composition, the script swaps the one
       in here, and the change is a cross-fade rather than a cut. Fading the
       stage rather than the component keeps that a property of the scaffolding
       — nothing is written against a component class, and a composition's own
       --…-mix cross-fade is left to mean what it means. */
    .stage {
      min-width: 0;
      max-width: 100%;
      transition: opacity 160ms linear;
    }

    @media (prefers-reduced-motion: reduce) {
      .stage { transition: none; }
    }
  </style>
</head>

    off and the stop list underneath is what is left. The --raw half of a pair

         it layers over any theme and either recipe. Both drawings here are
         drawn edge to edge on purpose: where the artwork leaves a gap the base
         shows through, which reads as a highlight on paper and as a hole on
         ink. The card runs the stop recipe rather than a drawing, and that is
         not a preference: a --draw is absolutely positioned and would paint over
         the copy, so a surface carries a drawing or content and never both. It is
         the one here carrying content — the figure, the label and the micro line,
         each a ratio of --size, sitting in the half the recipe has settled. -->

             style="width: 26rem; max-width: 100%;

  <template data-composition="stepUp">
    <!-- The same construction as the card with the copy the other way
         round: short to long, so the step walks right. --up is a requirement
         rather than a decoration — it is what tells a band which of its left
         corners is exposed and which of a pair may grow to cover the join, and
         both answers change with the direction. A rag that goes out and back
         has no answer, which is why there is no state for one. -->
    <section class="drawn-gradients"
             style="width: 26rem; max-width: 100%;
                    --drawn-gradients-size: 8rem;
                    --drawn-gradients-blur-ratio: 0.24;">
      <div class="drawn-gradients__usage drawn-gradients__usage--up">
        <div class="drawn-gradients__usage-row">
          <span class="drawn-gradients__usage-line drawn-gradients__usage-line--label">Wash</span>
          <span class="drawn-gradients__surface drawn-gradients__surface--step drawn-gradients__surface--mix drawn-gradients__surface--mint"
                style="--drawn-gradients-step-row: 0;">
            <svg class="drawn-gradients__draw" viewBox="0 0 120 120"
                 preserveAspectRatio="xMidYMid slice" aria-hidden="true">
              <ellipse class="drawn-gradients__blob drawn-gradients__blob--hot"
                       cx="26" cy="20" rx="82" ry="54" transform="rotate(-18 26 20)" />
              <ellipse class="drawn-gradients__blob drawn-gradients__blob--cool"
                       cx="104" cy="48" rx="70" ry="48" transform="rotate(24 104 48)" />
              <ellipse class="drawn-gradients__blob drawn-gradients__blob--warm"
                       cx="54" cy="104" rx="88" ry="52" transform="rotate(-8 54 104)" />

        <div class="drawn-gradients__usage-row">
          <span class="drawn-gradients__usage-line drawn-gradients__usage-line--label">Flat colour</span>
          <span class="drawn-gradients__surface drawn-gradients__surface--step drawn-gradients__surface--mix drawn-gradients__surface--mint"
                style="--drawn-gradients-step-row: 1;">
            <svg class="drawn-gradients__draw" viewBox="0 0 120 120"
                 preserveAspectRatio="xMidYMid slice" aria-hidden="true">
              <ellipse class="drawn-gradients__blob drawn-gradients__blob--hot"
                       cx="26" cy="20" rx="82" ry="54" transform="rotate(-18 26 20)" />
              <ellipse class="drawn-gradients__blob drawn-gradients__blob--cool"
                       cx="104" cy="48" rx="70" ry="48" transform="rotate(24 104 48)" />
              <ellipse class="drawn-gradients__blob drawn-gradients__blob--warm"
                       cx="54" cy="104" rx="88" ry="52" transform="rotate(-8 54 104)" />
            </svg>
          </span>
        </div>
        <span class="drawn-gradients__usage-line drawn-gradients__usage-line--value">61%</span>

        <div class="drawn-gradients__usage-row">
          <span class="drawn-gradients__usage-line drawn-gradients__usage-line--label">Overlapping art</span>
          <span class="drawn-gradients__surface drawn-gradients__surface--step drawn-gradients__surface--mix drawn-gradients__surface--mint"
                style="--drawn-gradients-step-row: 2;">
            <svg class="drawn-gradients__draw" viewBox="0 0 120 120"
                 preserveAspectRatio="xMidYMid slice" aria-hidden="true">
              <ellipse class="drawn-gradients__blob drawn-gradients__blob--hot"
                       cx="26" cy="20" rx="82" ry="54" transform="rotate(-18 26 20)" />
              <ellipse class="drawn-gradients__blob drawn-gradients__blob--cool"
                       cx="104" cy="48" rx="70" ry="48" transform="rotate(24 104 48)" />
              <ellipse class="drawn-gradients__blob drawn-gradients__blob--warm"
                       cx="54" cy="104" rx="88" ry="52" transform="rotate(-8 54 104)" />

  </template>
  <!--
    Thumbnail scaffolding only, driven by the index and inert when this file is
    opened on its own.

    Two things are being set from here, and both are the component's own
    tunables rather than rules written against its classes. The base is what
    the field settles to: the recipe settles to the surface colour it sits on,
    and only this page knows what colour that is. It is set on each
    composition's block rather than on its surfaces, which is what leaves
    --night's own base standing — a class on the surface beats a value
    inherited from the block above it.

    The second is `active`, and it is a bigger move than a colour: it changes
    RECIPE. At rest the drawing is showing. Looked at, it dissolves off and
    leaves the stop list underneath — the same silhouette and the same hues,
    made the other way. That is the folder's whole thesis, and a surface is the
    one place it can be a change rather than two states side by side.

    It cross-fades because the two are ON one surface rather than swapping:
    --mix puts the drawing over the stop list instead of in place of it, and
    --drawn-gradients-mix is its opacity. An earlier version toggled --drawn
    and cut, because --drawn sets background-image: none and there was nothing
    underneath to fade into. --…-mix-ease is the curve: 520ms rather than the
    280 --ease spends on a colour, because this moves the whole surface from
    one construction to the other.

    Which is also why only --mix surfaces are painted. On a --drawn or a --raw
    tile the drawing IS the surface, so taking its opacity to zero empties the
    tile rather than revealing anything — the raw half of every pair in the set
    holds still for exactly that reason.

    Colours were tried first for `active` and all of them were smaller. A base
    off the page — sand, a paper tint — read as the card being slightly warmer
    rather than as an event. Lime was the best of them, and the sweep behind it
    is worth keeping: the base is what BOTH blocks of the card ramp into, so a
    base near either hot end's complement greys out through the middle. Amber
    is lovely under the magenta and turns the blue block to khaki; a cool slate
    completes the blue and fights the magenta; lilac avoids both by sitting
    between the two hues and is dull for the same reason. The base stays on the
    page's ground now: it is what the stopped end of the mix washes out to.

    The settle *direction* was the other candidate — swapping --rise onto the
    lower block so the pair fades inward. Built and dropped: the widest bands
    carry most of the field's area and they are the ones that wash out, so the
    staircase stops reading at exactly the moment the card is being looked at.

    Two routes into the same state, and neither is the component's own :hover.
    A card thumbnail has pointer events off, so the index sends the message;
    quick look runs this file with pointer events on, where the listeners
    below fire instead and the message never arrives. The state is one
    function either way. It is not a CSS :hover rule because the base swap is
    a thumbnail's editorial decision about its own resting state, not
    something a gradient field does when a pointer is over it.

    --- the variant axis is composition, not colour --------------------------

    It used to be the theme: one shape, six dots, dawn through arc. Every dot
    said the same sentence with a different adjective, and the card already
    drifts through three colour pairs on its own — so the axis quick look was
    spending was the one the thumbnail spends for free, and the rest of the
    folder (twelve drawings, six shapes, the ink base, the other rag) was
    reachable only by opening the demo.

    So a dot is a composition now, and they run in the demo's own order:
    the card, the set as component.html builds it, the shapes, the themes, the
    night base, the step run the other way. The colour axis did not go — it is
    one stop instead of five, which is also the only place it can be compared
    rather than remembered.

    Each is a <template> above, cloned on first use and kept: a composition
    that has been looked at costs nothing to come back to, and its blurred
    layers raster once. Templates rather than markup hidden with a class,
    because inert is the one thing a <template> already is — nothing in one
    lays out, paints, or loads until it is cloned, which is what keeps a card
    thumbnail paying for its own composition and nothing else.

    `active` means the same thing in all six, and that is deliberate: every
    surface that can hold both recipes holds both, so whichever composition is
    up, being looked at is the stop list arriving. A theme swap on hover was
    the other candidate and is now doubly wrong — the themes composition exists
    to be compared, and a pointer that recoloured it would be arguing with the
    thing it is showing.

    The drift belongs to the resting composition alone. It is the card's
    answer to a rail that has to carry colour without paying for it, and on a
    picked composition it would be a second thing happening underneath the one
    that was asked for.
  -->
  <script>
    (function () {
      var CHANNEL = 'interface-studies';
      var MIX = 'drawn-gradients__surface--mix';
      /* What the field settles to. Set as the component's own tunable, from
         outside, which is what that block is for. */
      var GROUND = '#f3f2ef';

      var stage = document.querySelector('[data-stage]');
      if (!stage || !stage.firstElementChild) return;

      // First entry is the resting state, and it is what the card shows. The
      // rest are the <template>s above, by id.
      var VARIANTS = [
        { id: 'card', label: 'Two blocks, one field' },
        { id: 'set', label: 'Drawn, then blurred' },
        { id: 'shapes', label: 'Every shape, one recipe' },
        { id: 'themes', label: 'Five themes' },
        { id: 'night', label: 'Settling to ink' },
        { id: 'stepUp', label: 'The step walks right' }
      ];

      // Two inputs, one render, because the two arrive independently: quick
      // look can step a variant while the pointer is already inside it, and
      // applying either one on its own would drop the other.
      var variant = VARIANTS[0];
      var active = false;
      var scale = 0;      // what the index last reported, until it does
      var front = 0;      // which tinted copy the drift is showing
      var root = null;

      // Built once and kept, which is what makes stepping back and forth
      // through the dots free after the first pass.
      var built = {};
      var bound = [];
      built[VARIANTS[0].id] = stage.firstElementChild;

      function compose(id) {
        if (built[id]) return built[id];
        var tpl = document.querySelector('template[data-composition="' + id + '"]');
        var node = tpl && tpl.content.firstElementChild;
        built[id] = node ? node.cloneNode(true) : null;
        return built[id];
      }

      function mixed(node) {
        return Array.prototype.slice.call(
          node.querySelectorAll('.drawn-gradients__surface')
        ).filter(function (el) { return el.classList.contains(MIX); });
      }

      // Which copy is showing, and how hard. One at the mix and the rest at
      // zero, so a step is a single cross-fade and being looked at is all of
      // them going down together.
      function paint(node) {
        mixed(node).forEach(function (el) {
          var d = el.querySelectorAll('.drawn-gradients__draw');
          for (var i = 0; i < d.length; i++) {
            d[i].style.setProperty(
              '--drawn-gradients-mix',
              (i === front && !active) ? '1' : '0'
            );
          }
        });
      }

      // The mask's antialiasing ramp is authored as one DEVICE pixel, and
      // component.css picks it with resolution media queries — which can only
      // see this frame's own ratio. A card lays the preview out at
      // --preview-w and shows it at --preview-scale, so the ramp is rasterised
      // at a fraction of the pixel it asked for: at 0.55 it lands at half a
      // device pixel, gets point-sampled, and every curve in the thumbnail
      // stair-steps. The index reports the factor; the ramp is restated
      // against it here, inline, so it beats the media queries.
      //
      // A tunable set from outside, which is the whole point of the custom
      // property block — this file still never writes a rule against a
      // component class. Standalone, no message arrives and the media queries
      // stand as authored.
      function applyScale(node) {
        if (!(scale > 0)) return;
        var dpr = window.devicePixelRatio || 1;
        node.style.setProperty(
          '--drawn-gradients-step-feather',
          (1 / (dpr * scale)).toFixed(4) + 'px'
        );
      }

      function dress(node) {
        node.style.setProperty('--drawn-gradients-base', GROUND);
        applyScale(node);
        // Only the resting composition carries the drift's three tinted
        // copies; everywhere else there is one drawing per surface.
        if (!drifting()) front = 0;
        node.style.removeProperty('--drawn-gradients-mix-ease');
        paint(node);
      }

      // Quick look runs the file with pointer events on, so the component's
      // own pointer is what fires here; a card thumbnail has them off and the
      // index sends the message instead. Once per composition, since a built
      // one is kept and re-mounted.
      function bind(node) {
        if (bound.indexOf(node) > -1) return;
        bound.push(node);
        node.addEventListener('pointerenter', function () { setActive(true); });
        node.addEventListener('pointerleave', function () { setActive(false); });
      }

      // Dressed while it is still detached, so a composition arrives in the
      // state it should be in rather than transitioning into it from the
      // stylesheet's defaults — the first style resolution of a new element
      // does not animate.
      function place(node) {
        dress(node);
        if (root && root.parentNode === stage) stage.replaceChild(node, root);
        else stage.appendChild(node);
        root = node;
        bind(node);
      }

      var FADE = 160;
      var still = window.matchMedia('(prefers-reduced-motion: reduce)');
      var pending = 0;

      function show(next) {
        variant = next;
        var node = compose(next.id);
        if (!node) return;
        if (node === root) { dress(node); return; }
        if (pending) { window.clearTimeout(pending); pending = 0; }
        if (still.matches) { place(node); return; }
        stage.style.opacity = '0';
        pending = window.setTimeout(function () {
          pending = 0;
          place(node);
          stage.style.opacity = '1';
        }, FADE);
      }

      function setActive(next) {
        next = !!next;
        if (next === active) return;
        active = next;
        if (!root) return;
        // The recipe is what being looked at changes, and the move is one
        // number per copy: 1 is the drawing, 0 is the stop list, and
        // component.css eases between them at its own speed rather than the
        // drift's.
        root.style.removeProperty('--drawn-gradients-mix-ease');
        paint(root);
      }

      /* --- the slow drift ------------------------------------------------
         Every band of the resting composition carries the drawing three times,
         each copy tinted once in the markup and never again, and the card
         cross-fades between them on a three-second beat — 1.5s moving, 1.5s
         held, so the field is always about to change rather than occasionally
         changing. Colour in the rail without the rail paying for it.

         Three FIXED copies rather than two re-tinted ones, and that is the
         whole performance answer. The blobs' fills interpolate, so moving the
         hues in place looks identical — but it re-runs the blur on every band
         for every frame of the fade, and re-tinting a hidden copy re-rasters
         it before the fade even starts. Measured in the card with the rail
         being dragged: re-tinting cost one 83 to 117ms frame per step and 3
         to 5 dropped frames per fade; three fixed copies raster once at load
         (36 to 86ms for all eighteen) and after that the drift is opacity on
         layers that never change — steady state came back 60fps with ZERO
         frames over 20ms, in the frame and on the rail both.

         Pairs rather than single hues, because the card is two blocks and
         they have to stay different: one field reading two ways is the
         composition, and a step that put the same theme on both would flatten
         it. The first copy carries no tint at all, so it follows the theme
         class in the markup.

         It holds still whenever moving would be wrong: nothing under
         prefers-reduced-motion, nothing while the tab is hidden, nothing
         while the card is being looked at — under the pointer the wash is the
         state, and a colour arriving underneath it would be a second thing
         happening — and nothing off the resting composition, since a picked
         one is the dot's answer and not this timer's. */
      var DRIFT = '1500ms cubic-bezier(0.65, 0, 0.35, 1)';
      var STEP = 3000;

      function drifting() { return variant === VARIANTS[0]; }

      function drift() {
        if (!root || active || document.hidden || !drifting()) return;
        var first = mixed(root)[0];
        if (!first) return;
        var n = first.querySelectorAll('.drawn-gradients__draw').length;
        if (n < 2) return;
        front = (front + 1) % n;
        // The drift is slower than the hover dissolve, and a transition reads
        // its duration from the style in force when the value changes — so it
        // is set just before, and dropped again on any other change so that
        // being looked at gets component.css's own speed back.
        root.style.setProperty('--drawn-gradients-mix-ease', DRIFT);
        paint(root);
      }

      if (!still.matches) window.setInterval(drift, STEP);

      window.addEventListener('message', function (event) {
        var data = event.data;
        if (!data || data.source !== CHANNEL) return;

        if (data.type === 'preview') {
          setActive(data.active);
        }

        if (data.type === 'preview:variant') {
          var next = VARIANTS[data.index];
          if (next) show(next);
        }

        if (data.type === 'preview:scale') {
          if (!(data.scale > 0)) return;
          scale = data.scale;
          if (root) applyScale(root);
        }
      });

      place(built[VARIANTS[0].id]);

      // Quick look runs this file with pointer events live, so the pointer —
      // and with it the focus — ends up inside this document. Keys pressed
      // here fire against *this* document and never reach the index, which is
      // where the overlay's Escape handler lives: click the component, press
      // Escape, and nothing happens. So the one key the overlay owns is handed
      // back across the channel. Only Escape. Anything else is the component's
      // to interpret — arrows move a caret in a field the component may have.
      if (window.parent !== window) {
        document.addEventListener('keydown', function (event) {
          if (event.key !== 'Escape') return;
          window.parent.postMessage({ source: CHANNEL, type: 'preview:key', key: 'Escape' }, '*');
        });
      }

      if (window.parent !== window) {
        window.parent.postMessage({
          source: CHANNEL,
          type: 'preview:ready',
          variants: VARIANTS.map(function (v) { return { id: v.id, label: v.label }; })
        }, '*');
      }
    })();
  </script>

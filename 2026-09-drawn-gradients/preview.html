  <!--
    Thumbnail scaffolding only, and inert when this file is opened on its own.
    Quick look steps through the themes; the list lives here because the index
    must never name a component class. There is no hover state to drive, so the
    'preview' message is ignored.

    Theme classes are swapped rather than added, and each surface's authored
    theme is remembered, so the first entry can put the mix back.
  -->
  <script>
    (function () {
      var CHANNEL = 'ui-reference-base';
      var BASE = 'drawn-gradients__surface--';
      var surfaces = Array.prototype.slice.call(
        document.querySelectorAll('.drawn-gradients__surface')
      );
      if (!surfaces.length) return;

      var THEMES = ['dawn', 'dusk', 'mint', 'ice'];

      var VARIANTS = [
        { id: 'mixed', label: 'As authored', theme: null, tone: 'light' },
        { id: 'dawn', label: 'Dawn', theme: ['dawn'], tone: 'light' },
        { id: 'dusk', label: 'Dusk', theme: ['dusk'], tone: 'light' },
        { id: 'mint', label: 'Mint', theme: ['mint'], tone: 'light' },
        { id: 'ice', label: 'Ice', theme: ['ice'], tone: 'light' },
        { id: 'night', label: 'Settling to ink', theme: ['dusk', 'night'], tone: 'dark' }
      ];

      // What each surface was authored with, so 'mixed' can restore it.
      var authored = surfaces.map(function (el) {
        return THEMES.filter(function (t) { return el.classList.contains(BASE + t); });
      });

      function apply(variant) {
        surfaces.forEach(function (el, i) {
          THEMES.forEach(function (t) { el.classList.remove(BASE + t); });
          el.classList.remove(BASE + 'night');

          var wanted = variant.theme || authored[i];
          wanted.forEach(function (t) { el.classList.add(BASE + t); });
        });

        // Not transitioned on purpose: inside a framed document a
        // background-color transition stalls part-way and leaves the surround
        // a muddy mid-tone.
        document.body.style.backgroundColor =
          variant.tone === 'dark' ? '#101216' : '#f3f2ef';
        document.documentElement.style.backgroundColor =
          variant.tone === 'dark' ? '#101216' : '#f3f2ef';
      }

      window.addEventListener('message', function (event) {
        var data = event.data;
        if (!data || data.source !== CHANNEL) return;

        if (data.type === 'preview:variant') {
          var variant = VARIANTS[data.index];
          if (variant) apply(variant);
        }
      });

      if (window.parent !== window) {
        window.parent.postMessage({
          source: CHANNEL,
          type: 'preview:ready',
          variants: VARIANTS.map(function (v) { return { id: v.id, label: v.label }; })
        }, '*');
      }
    })();
  </script>

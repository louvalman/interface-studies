<!--
  Shapes:  --tile  --circle  --arch  --pill  --card  --band
  Themes:  --dawn  --dusk  --mint  --ice  --arc   (+ --night, which moves
           the base the colour settles to, and composes with any of them)

  Settle:  the colour gathers at the top edge and dissolves down. --rise turns
           that around — it gathers at the bottom and dissolves up — which is
           what lets two blocks stacked into a mirrored pair fade away from
           each other instead of both starting hot at their own top edge. It
           composes with either recipe, and it is for surfaces that carry no
           content: .drawn-gradients__value and the rest sit in the lower half
           because that is where the default recipe has settled.

  Recipes: the stop list is the default; --drawn swaps it for an SVG that is
           blurred into the same kind of field, and --raw shows that drawing
           before the blur, with no outline on it. --…-bleed and --…-blur tune
           it; --…-raw-stroke puts a construction outline back.

           --mix is the third option: the drawing sits ON the stop list rather
           than in place of it, and --…-mix is its opacity. At 1 that is the
           drawn surface, at 0 the stopped one, and between them both at once
           — the one part of the recipe besides the base that interpolates, so
           it is what a state can be eased through. --…-mix-ease is its curve,
           and it wants the drawing in the markup either way.

  --step's own block takes --down or --up to say which way the labels rag, which
  is what decides which of each band's two left corners is on the outside and
  gets the radius. Leave it off for a rag that is not monotonic.

  --step is the one shape that expects to be used rather than looked at, and
  the one whose geometry comes out of the copy: it is a band per line inside
  .drawn-gradients__usage, each starting where its own label ends, so the rag
  of the type is the staircase. --…-step-gap is the constant between the two,
  --…-step-row-h the band height, --…-step-field how wide the shared gradient
  is drawn, and --…-step-row on each band says which slice it shows. Give
  --…-step-rows the number of lines.

  The two axes are independent — any theme on any shape. Everything else is a
  custom property: pool origins (--…-pool-x/y, --…-wash-x/y), how far each
  reaches (--…-pool-reach, --…-wash-reach), where the colour has fully settled
  (--…-settle), the base it settles to (--…-base), and the three gaps
  (--…-pair-gap inside a pair, --…-gap between pairs, --…-row-gap between
  rows).
-->
